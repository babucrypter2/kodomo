<body>

<script>
/*
 * タップであそぼ — 1〜5さい向けタップあそび（HTML 1ファイル完結）
 * ・画像/音声ファイルなし。絵は canvas、音は Web Audio で作っています
 * ・もどるボタンは左上の小さな丸を「長押し」（子どもの誤タップ対策）
 */
(() => {
'use strict';

/* ================= きほん ================= */
const PI = Math.PI, TAU = PI * 2;
const rand = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const inOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
};

/* いろ（おりがみの色） */
const INK = '#2B2D5B';
const C = { red: '#FF5A4E', orange: '#FF9A3C', yellow: '#FFCB3D', green: '#5CC46A', sky: '#4AB8F0', blue: '#4F7BEA', violet: '#8F6BE8', pink: '#FF8FB8' };
const RAINBOW = [C.red, C.orange, C.yellow, C.green, C.sky, C.blue, C.violet, C.pink];
const F_JP = '"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic",sans-serif';
const F_NUM = '"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Noto Sans CJK JP",sans-serif';
const NO = {};

const store = {
  get(k, d) { try { const v = localStorage.getItem('tapasobo:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tapasobo:' + k, JSON.stringify(v)); } catch (e) {} }
};

const shadeCache = new Map();
/* hex(#RRGGBB) を明るく(+)／暗く(-)する */
function shade(hex, amt) {
  const key = hex + amt;
  let v = shadeCache.get(key);
  if (v) return v;
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { const k = 1 + amt; r *= k; g *= k; b *= k; }
  v = 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  shadeCache.set(key, v);
  return v;
}

/* ================= がめん ================= */
const canvas = document.getElementById('game');
const mainCtx = canvas.getContext('2d', { alpha: false });
let ctx = mainCtx;
const safeEl = document.getElementById('safe');
let W = 0, H = 0, DPR = 1, time = 0;
const safe = { t: 0, r: 0, b: 0, l: 0 };   // ノッチ・ホームバーをよける余白

function measure() {
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(120, Math.round(rect.width || window.innerWidth || 320));
  const h = Math.max(120, Math.round(rect.height || window.innerHeight || 480));
  const dpr = clamp(window.devicePixelRatio || 1, 1, 3);
  let st = 0, sr = 0, sb = 0, sl = 0;
  try {
    const cs = getComputedStyle(safeEl);
    st = parseFloat(cs.paddingTop) || 0; sr = parseFloat(cs.paddingRight) || 0;
    sb = parseFloat(cs.paddingBottom) || 0; sl = parseFloat(cs.paddingLeft) || 0;
  } catch (e) {}
  if (w === W && h === H && dpr === DPR && st === safe.t && sr === safe.r && sb === safe.b && sl === safe.l) return false;
  if (dpr !== DPR) clearSprites();
  W = w; H = h; DPR = dpr;
  safe.t = st; safe.r = sr; safe.b = sb; safe.l = sl;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  return true;
}

/* うごかない背景を1まいの絵にしておく */
function makeLayer(draw) {
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d', { alpha: false });
  const prev = ctx;
  ctx = g;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  try { draw(); } finally { ctx = prev; }
  return c;
}
function freeLayer(c) { if (c) { c.width = 0; c.height = 0; } return null; }

/* ================= えをかく道具 ================= */
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function oval(x, y, rx, ry, fill, rot) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, TAU); ctx.fill(); }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fillRR(x, y, w, h, r, fill) { rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
/* 紙をかさねたような「かげつきカード」 */
function card(x, y, w, h, r, fill, sh, depth) {
  if (depth) fillRR(x, y + depth, w, h, r, sh);
  fillRR(x, y, w, h, r, fill);
}
function star(x, y, R, fill, rot) {
  const r = R * 0.5;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) - PI / 2 + i * PI / 5, d = i % 2 ? r : R;
    if (i) ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); else ctx.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = fill; ctx.lineWidth = R * 0.24; ctx.lineJoin = 'round'; ctx.stroke();
}
function setFont(px, fam, weight) { ctx.font = (weight || 'bold') + ' ' + Math.max(1, px).toFixed(1) + 'px ' + (fam || F_JP); }
function text(str, x, y, px, fill, o) {
  o = o || NO;
  setFont(px, o.fam, o.weight);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || px * 0.2; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}
function textW(str, px, fam, weight) { setFont(px, fam, weight); return ctx.measureText(str).width; }

/* 白いなふだ */
function nameTag(str, cx, cy, h) {
  const fs = h * 0.6, w = textW(str, fs) + h * 0.95;
  fillRR(cx - w / 2, cy - h / 2 + 2.5, w, h, h / 2, 'rgba(43,45,91,.2)');
  fillRR(cx - w / 2, cy - h / 2, w, h, h / 2, '#fff');
  text(str, cx, cy + h * 0.03, fs, INK);
}
/* まるい色紙にのった1文字（タイトル・ほめことば） */
function paperLetter(ch, x, y, d, color, rot, sc) {
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (sc !== undefined && sc !== 1) ctx.scale(sc, sc);
  circle(0, d * 0.07, d / 2, shade(color, -0.24));
  circle(0, 0, d / 2, color);
  text(ch, 0, d * 0.03, d * 0.58, '#fff');
  ctx.restore();
}

/* ================= おと（Web Audio でその場で合成） ================= */
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
const DOREMI = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5, 1174.66, 1318.51];

const Sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null, out = null, noiseBuf = null;
  let enabled = store.get('sound', true);
  const ends = [], pending = [];
  /* iPhone：マナーモードでも鳴るように（音量ボタンで調整できる） */
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

  function init() {
    if (ac || !AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    const comp = ac.createDynamicsCompressor();
    try { comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.18; } catch (e) {}

    out.gain.value = 0.8;

    comp.connect(ac.destination);
    const n = Math.floor(ac.sampleRate * 1.2);
    noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    ac.onstatechange = () => { if (ac && ac.state === 'running') flush(); };
  }
  /* 指がはなれた瞬間などに呼ぶ（iOS は操作のあとでないと音を出せない） */
  function unlock() {
    init();
    if (!ac || ac.state === 'running') return;
    try { const p = ac.resume(); if (p && p.then) p.then(flush, () => {}); } catch (e) {}
    try { const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0); } catch (e) {}
  }
  function suspend() { try { if (ac && ac.state === 'running') ac.suspend(); } catch (e) {} }
  function wake() { try { if (ac && ac.state !== 'running') { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } } catch (e) {} }

  /* 同時に鳴らしすぎない */
  function busy(t1) {
    const now = ac.currentTime;
    for (let i = ends.length - 1; i >= 0; i--) if (ends[i] <= now) ends.splice(i, 1);
    if (ends.length >= 44) return true;
    ends.push(t1);
    return false;
  }
  function tone(type, f0, f1, dur, vol, at, atk) {
    const t0 = ac.currentTime + (at || 0);
    if (busy(t0 + dur)) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + Math.min(atk || 0.005, dur * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    o.start(t0); o.stop(t0 + dur + 0.02);
    o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) {} };
  }
  function hiss(dur, vol, type, f0, f1, q, at, atk) {
    const t0 = ac.currentTime + (at || 0);

    f.type = type; f.Q.value = q || 0.8;
    f.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + Math.min(atk || 0.004, dur * 0.5));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t0, Math.random()); s.stop(t0 + dur + 0.02);
    s.onended = () => { try { s.disconnect(); f.disconnect(); g.disconnect(); } catch (e) {} };
  }
  /* もっきん風の1音 */
  const note = (f, v, d, at) => {
    v = v || 0.36; d = d || 0.9;
    tone('sine', f, f, d, v, at, 0.004);
    tone('sine', f * 4, f * 4, d * 0.2, v * 0.2, at, 0.002);
  };

  const FX = {
    tick() { tone('sine', 1100, 1700, 0.07, 0.2); tone('sine', 2200, 2600, 0.04, 0.05, 0.02); },
    charge(d) { tone('sine', 380, 980, d || 0.6, 0.07, 0, 0.05); },
    nope() { tone('sine', 520, 380, 0.12, 0.12); },
    pencil() { hiss(0.07, 0.05, 'bandpass', 2600, 3200, 1.6); },
    stroke(i) { note(DOREMI[(i || 0) % DOREMI.length], 0.34, 0.6); tone('sine', 1568, 2093, 0.12, 0.06, 0.04); },
    pop(p) { p = p || 1; hiss(0.09, 0.5, 'bandpass', 1600 * p, 500 * p, 0.7); tone('sine', 640 * p, 150 * p, 0.12, 0.32); },
    note,
    chime() { note(pick(PENTA), 0.26, 0.7); },
    sparkle() { [1568, 1976, 2349, 3136].forEach((f, i) => tone('sine', f, f, 0.2, 0.09, i * 0.05, 0.003)); },
    boing() { tone('triangle', 190, 580, 0.2, 0.28); tone('sine', 380, 1160, 0.2, 0.08); },
    bonk() { tone('square', 880, 880, 0.05, 0.1); tone('square', 1320, 1320, 0.08, 0.1, 0.05); tone('sine', 280, 110, 0.1, 0.3); },
    wobble() { tone('triangle', 320, 230, 0.18, 0.2); },
    whoosh() { hiss(0.32, 0.2, 'bandpass', 500, 2800, 0.9, 0, 0.1); },
    enter() { note(659.25, 0.28, 0.3); note(880, 0.28, 0.3, 0.08); note(1318.51, 0.28, 0.5, 0.16); },
    back() { note(880, 0.24, 0.3); note(659.25, 0.24, 0.3, 0.08); note(523.25, 0.24, 0.45, 0.16); },
    fanfare() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(f, 0.26, 0.35, i * 0.09));
      [659.25, 783.99, 1046.5, 1318.51].forEach(f => note(f, 0.15, 1.0, 0.4));
      [1568, 2093, 2637].forEach((f, i) => tone('sine', f, f, 0.25, 0.06, 0.56 + i * 0.06, 0.003));
    },
    boom(v) {
      v = v === undefined ? 1 : v;
      if (v <= 0) return;

    },
    fizz() { hiss(0.1, 0.07, 'highpass', 5200, 5200, 0.7); },
    drum() { tone('sine', 190, 55, 0.26, 0.9, 0, 0.002); hiss(0.08, 0.3, 'lowpass', 1400, 400, 0.7); },
    cymbal() { hiss(0.7, 0.3, 'highpass', 6500, 5000, 0.6, 0, 0.002); hiss(0.25, 0.2, 'bandpass', 9000, 7000, 2, 0, 0.002); },
    bell() { [[1, 0.26, 1.5], [2.76, 0.12, 0.9], [5.4, 0.07, 0.5], [8.93, 0.035, 0.3]].forEach(b => tone('sine', 1046.5 * b[0], 1046.5 * b[0], b[2], b[1], 0, 0.002)); },
    horn() { [0, 0.24].forEach(at => { tone('square', 415, 415, 0.17, 0.09, at, 0.01); tone('square', 523, 523, 0.17, 0.07, at, 0.01); }); },
    siren() { for (let i = 0; i < 4; i++) { const f = i % 2 ? 700 : 950; tone('triangle', f, f, 0.28, 0.22, i * 0.28, 0.02); } },
    vroom() { tone('sawtooth', 70, 170, 0.35, 0.12, 0, 0.02); tone('sawtooth', 170, 110, 0.3, 0.08, 0.32, 0.02); },
    swish() { tone('triangle', 260, 440, 0.1, 0.1); hiss(0.12, 0.07, 'bandpass', 900, 1900, 1); },
    hide() { tone('sine', 560, 260, 0.12, 0.08); },
    rise() { tone('sine', 300, 760, 0.09, 0.06); }
  };

  function play(name, args) {
    if (!enabled) return;
    if (!ac || ac.state !== 'running') {
      /* まだ音が出せないときは少しだけ覚えておき、出せるようになったら鳴らす */
      pending.push({ name, args, t: performance.now() });
      if (pending.length > 4) pending.shift();
      return;
    }
    try { FX[name].apply(null, args); } catch (e) {}
  }
  function flush() {
    if (!ac || ac.state !== 'running') return;
    const now = performance.now();
    while (pending.length) {
      const p = pending.shift();
      if (enabled && now - p.t < 700) { try { FX[p.name].apply(null, p.args); } catch (e) {} }
    }
  }

  function decode(ab) {
    init();
    return new Promise(res => {
      if (!ac) { res(null); return; }
      try { const p = ac.decodeAudioData(ab, b => res(b), () => res(null)); if (p && p.catch) p.catch(() => res(null)); } catch (e) { res(null); }
    });

      s.connect(g); g.connect(out); s.start();
      s.onended = () => { try { s.disconnect(); g.disconnect(); } catch (e) {} };

    unlock, suspend, wake, decode, playBuf,
    get enabled() { return enabled; },
    set enabled(v) { enabled = !!v; store.set('sound', enabled); }
  };
  Object.keys(FX).forEach(k => { api[k] = (...a) => play(k, a); });
  return api;
})();

/* ================= こえ（iPhone のよみあげ機能） ================= */
const Voice = (() => {

  const listeners = [];
  /* しぜんな声ほど上に。おもしろ声（Grandma など）は使わない */
  function rank(v) {
    const n = (v.name || '') + ' ' + (v.voiceURI || '');

const parts = [];
function addPart(p) {
  if (parts.length > 480) parts.splice(0, 40);
  p.max = p.life;
  parts.push(p);
  return p;
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.drag) { const d = Math.exp(-p.drag * dt); p.vx *= d; p.vy *= d; }
    if (p.g) p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
  }
}
function drawParts() {
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], f = p.life / p.max;
    ctx.globalAlpha = Math.min(1, f * 3);
    if (p.k === 'conf') {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 2.1 + p.ph));
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size * 0.32, p.size, p.size * 0.64);
      ctx.restore();
    } else if (p.k === 'star') {
      star(p.x, p.y, p.size * Math.min(1, (1 - f) * 8 + 0.3), p.color, p.rot);
    } else if (p.k === 'dot') {
      circle(p.x, p.y, p.size * (p.shrink ? f : 1), p.color);
    } else if (p.k === 'ring') {
      ctx.globalAlpha = f;
      ctx.strokeStyle = p.color; ctx.lineWidth = p.lw * f + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * outCubic(1 - f) + 2, 0, TAU); ctx.stroke();
    } else if (p.k === 'note') {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.rot) * 0.3);
      text('♪', 0, 0, p.size, p.color, { stroke: '#fff', sw: p.size * 0.24 });
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function burstConfetti(x, y, n, power, colors) {
  power = power || 1; colors = colors || RAINBOW;
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), v = rand(120, 420) * power;
    addPart({ k: 'conf', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140 * power, g: 760, drag: 1.7, rot: rand(TAU), vr: rand(-9, 9), ph: rand(TAU), life: rand(0.8, 1.3), size: rand(7, 12), color: pick(colors) });
  }
}
function burstStars(x, y, n, power, colors) {
  power = power || 1; colors = colors || RAINBOW;
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), v = rand(90, 300) * power;
    addPart({ k: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 240, drag: 2.4, rot: rand(TAU), vr: rand(-5, 5), life: rand(0.45, 0.8), size: rand(5, 9), color: pick(colors) });
  }
}
function ringFx(x, y, r, color, lw, life) {
  addPart({ k: 'ring', x, y, vx: 0, vy: 0, life: life || 0.4, size: r, color: color || '#fff', lw: lw || 5 });
}
/* なにもない所をさわっても、かならず反応する */
function tapSparkle(x, y) {
  ringFx(x, y, 30, 'rgba(255,255,255,.95)', 5, 0.34);
  burstStars(x, y, 5, 0.6);
  Sound.tick();
}
function rainConfetti(n) {
  for (let i = 0; i < n; i++) {
    addPart({ k: 'conf', x: rand(W), y: rand(-H * 0.45, -10), vx: rand(-40, 40), vy: rand(140, 320), g: 110, drag: 0.35, rot: rand(TAU), vr: rand(-7, 7), ph: rand(TAU), life: rand(2.2, 3.2), size: rand(8, 14), color: pick(RAINBOW) });
  }
}

let banner = null;
function celebrate(word, big, speech) {
  let w = word, sp = speech;
  if (!w) { const q = pick(big ? PRAISE_BIG : PRAISE), nm = big ? KIDS.big : KIDS.small; w = nm + ' ' + q[0]; sp = nm + '、' + q[1]; }
  banner = { text: w, t: 0, dur: 2.8 };
  rainConfetti(60);
  Sound.fanfare();
  /* 録音した声があればそれを、なければ よみあげ */
  if (!Rec.playAny('praise-' + (big ? 'big' : 'small') + '-', 3)) Voice.say(sp || w.replace(/ /g, '、'));
}
function heart(x, y, s, fill) {
  ctx.fillStyle = fill;

/* ママの写真が「すごーい！」と言っているように出す */
function drawBanner() {

  const lines = banner.text.split(' ');
  const hasPhoto = MAMA.complete && MAMA.naturalWidth > 0;
  const R = Math.min(W * 0.27, H * 0.17, 140), cx = W / 2, cy = H * 0.5;

    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R * 2.2 * k, i / 12 * TAU, (i + 1) / 12 * TAU); ctx.closePath(); ctx.fill();

  ctx.save(); ctx.translate(cx, cy); ctx.scale(k * (1 + talk), k * (1 + talk)); ctx.rotate(Math.sin(t * 5) * 0.04);
  circle(0, R * 0.06, R + 9, 'rgba(43,45,91,.25)');
  circle(0, 0, R + 9, '#FFFFFF');
  if (hasPhoto) {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.clip();
    const iw = MAMA.naturalWidth, ih = MAMA.naturalHeight, sc = Math.max(2 * R / iw, 2 * R / ih);
    ctx.drawImage(MAMA, -iw * sc / 2, -ih * sc / 2, iw * sc, ih * sc);
    ctx.restore();
  } else { circle(0, 0, R, C.pink); text('♡', 0, 0, R, '#fff'); }
  ctx.restore();

  for (let i = 0; i < 7; i++) {
    const a = i / 7 * TAU + 0.4, rise = ((t * 0.5 + i * 0.37) % 1);
    const hx = cx + Math.cos(a) * R * 1.35, hy = cy + Math.sin(a) * R * 1.1 - rise * R * 0.6;

  }
  ctx.globalAlpha = out;
  /* ふきだし */
  const bk = outBack(clamp((t - 0.2) / 0.35, 0, 1));

    const bw = Math.max(w1, w2) + 48, bh = (lines.length > 1 ? fs1 * 1.35 : 0) + fs2 * 1.3 + 26;
    const by = cy - R - 24 - bh;
    ctx.save(); ctx.translate(cx, by + bh); ctx.scale(bk, bk); ctx.translate(-cx, -(by + bh));
    fillRR(cx - bw / 2, by + 5, bw, bh, 26, 'rgba(43,45,91,.22)');
    fillRR(cx - bw / 2, by, bw, bh, 26, '#FFFFFF');

    text(lines[lines.length - 1], cx, ty + fs2 * 0.62, fs2, C.red, { stroke: '#FFFFFF', sw: 2 });

}

/* 白いふちのついたシールとして1回だけ作り、あとは貼るだけにする */
const SPR = { ox: 1.85, oy: 2.05, span: 3.7 };
const spriteCache = new Map();

  spriteCache.forEach(s => { s.c.width = 0; s.c.height = 0; });

function animalSprite(id, mood, variant) {
  const key = id + '|' + mood + '|' + variant;
  let s = spriteCache.get(key);
  if (s) return s;
  const u = Math.round(44 * clamp(DPR, 1, 3));
  const size = Math.ceil(SPR.span * u);
  const mk = () => { const c = document.createElement('canvas'); c.width = size; c.height = size; return c; };
  const a = mk(), ga = a.getContext('2d');

  paintAnimal(ga, id, mood, variant);
  const b = mk(), gb = b.getContext('2d');                 // 白いシルエット
  gb.drawImage(a, 0, 0);
  gb.globalCompositeOperation = 'source-in'; gb.fillStyle = '#fff'; gb.fillRect(0, 0, size, size);
  const ring = mk(), gr = ring.getContext('2d');           // ふちどり
  const bw = 0.085 * u;
  for (let k = 0; k < 20; k++) { const an = k / 20 * TAU; gr.drawImage(b, Math.cos(an) * bw, Math.sin(an) * bw); }
  gr.drawImage(b, 0, 0);
  gb.globalCompositeOperation = 'source-over'; gb.clearRect(0, 0, size, size); gb.drawImage(ring, 0, 0);
  gb.globalCompositeOperation = 'source-in'; gb.fillStyle = INK; gb.fillRect(0, 0, size, size);   // かげ
  const out = mk(), go = out.getContext('2d');
  go.globalAlpha = 0.22; go.drawImage(b, 0, 0.075 * u);
  go.globalAlpha = 1; go.drawImage(ring, 0, 0); go.drawImage(a, 0, 0);
  a.width = b.width = ring.width = 0;
  s = { c: out, u, size };
  spriteCache.set(key, s);

}
/* s = 顔の直径。o: {mood, variant, rot, sx, sy} */
function drawAnimal(id, x, y, s, o) {
  o = o || NO;
  const sp = animalSprite(id, o.mood || 0, o.variant || '');
  const half = s / 2, d = sp.size * (half / sp.u);

}

/* ================= パパ・ママの声（録音してほめる） ================= */
const Rec = (() => {
  const raw = new Map(), bufs = new Map();
  let db = null, mr = null, stream = null, stopT = 0;
  const openDB = () => new Promise(res => {
    try {
      const r = indexedDB.open('tapasobo', 1);
      r.onupgradeneeded = () => { try { r.result.createObjectStore('voices'); } catch (e) {} };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  const ready = openDB().then(d => {
    db = d;
    if (!d) return;
    return new Promise(res => {
      try {
        const rq = d.transaction('voices', 'readonly').objectStore('voices').openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { raw.set(c.key, c.value); c.continue(); } else res(); };
        rq.onerror = () => res();
      } catch (e) { res(); }
    });
  });
  function put(key, ab) {
    raw.set(key, ab);
    if (db) try { db.transaction('voices', 'readwrite').objectStore('voices').put(ab, key); } catch (e) {}
  }
  function del(key) {
    raw.delete(key); bufs.delete(key);
    if (db) try { db.transaction('voices', 'readwrite').objectStore('voices').delete(key); } catch (e) {}
  }
  function play(key) {
    const b = bufs.get(key);
    if (b) { Sound.playBuf(b); return true; }
    const ab = raw.get(key);
    if (!ab) return false;
    Sound.decode(ab.slice(0)).then(b2 => { if (b2) { bufs.set(key, b2); Sound.playBuf(b2); } });
    return true;
  }
  /* prefix0, prefix1 … のどれかを鳴らす。なければ false */
  function playAny(prefix, n) {
    if (!Sound.enabled || !Voice.enabled) return false;
    const ks = [];
    for (let i = 0; i < n; i++) if (raw.has(prefix + i)) ks.push(prefix + i);
    if (!ks.length) return false;
    Voice.stop();
    return play(pick(ks));
  }
  function warmup() { raw.forEach((ab, k) => { if (!bufs.has(k)) Sound.decode(ab.slice(0)).then(b => { if (b && raw.get(k) === ab) bufs.set(k, b); }); }); }
  function cleanup() {
    clearTimeout(stopT);
    if (stream) try { stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    stream = null; mr = null;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  }
  async function start(key, cb) {
    if (mr) return false;
    try {
      Sound.unlock();
      try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true } });
      const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/aac'];
      const type = (window.MediaRecorder && MediaRecorder.isTypeSupported) ? (types.find(t => MediaRecorder.isTypeSupported(t)) || '') : '';
      const rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      const chunks = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = async () => {
        cleanup();
        try {
          const blob = new Blob(chunks, { type: rec.mimeType || type || 'audio/mp4' });
          const ab = await blob.arrayBuffer();
          const b = await Sound.decode(ab.slice(0));
          if (b && b.duration > 0.25) { put(key, ab); bufs.set(key, b); cb && cb(true); }
          else cb && cb(false, 'みじかすぎました');
        } catch (e) { cb && cb(false, String(e && e.message || e)); }
      };
      mr = rec;
      rec.start();
      stopT = setTimeout(stop, 5000);
      return true;
    } catch (e) {
      cleanup();
      cb && cb(false, 'マイクが使えませんでした（設定でマイクを許可してください）');
      return false;
    }
  }
  function stop() { try { if (mr && mr.state !== 'inactive') mr.stop(); } catch (e) { cleanup(); } }
  return { ready, play, playAny, del, start, stop, warmup, has: k => raw.has(k), get recording() { return !!mr; } };
})();

function miniBurst(x, y, r, rot, cols) {
  ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU + rot, c = cols[i % cols.length], k = 0.84 + 0.16 * Math.sin(time * 2.4 + i * 1.7);
    ctx.strokeStyle = c; ctx.lineWidth = Math.max(2, r * 0.11);
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r * 0.36, y + Math.sin(a) * r * 0.36);
    ctx.lineTo(x + Math.cos(a) * r * 0.76 * k, y + Math.sin(a) * r * 0.76 * k);
    ctx.stroke();
    circle(x + Math.cos(a) * r * k, y + Math.sin(a) * r * k, Math.max(1.5, r * 0.07), c);
  }
}
/* カードの中のちいさな絵（x,y = まんなか、s = つかえる大きさ） */
const TILE_ART = {
  drive(x, y, s, w) {
    const rh = s * 0.7, off = (time * 140) % 44, vs = Math.min(s * 0.5, w * 0.26);
    ctx.fillStyle = '#5A5F7D'; ctx.fillRect(x - w / 2, y - rh / 2, w, rh);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - w / 2, y - rh / 2, w, 4); ctx.fillRect(x - w / 2, y + rh / 2 - 4, w, 4);
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let dx = -w / 2 - off; dx < w / 2; dx += 44) ctx.fillRect(x + dx, y - 2, 22, 4);
    const b = Math.sin(time * 9) * 1.2;
    drawVehicle('police', x - w * 0.27, y - rh * 0.22 + b, vs, PI / 2);
    drawVehicle('car', x + w * 0.02, y + rh * 0.22 - b, vs, PI / 2);
    drawVehicle('bike', x + w * 0.3, y - rh * 0.22 + b, vs * 0.95, PI / 2);
  },
  hira(x, y, s) {
    const cs = s * 0.36;
    [['あ', -0.36, 0.06, -0.14, C.red], ['い', 0, -0.08, 0.04, C.green], ['う', 0.36, 0.08, 0.16, C.sky]].forEach((q, i) => {
      ctx.save(); ctx.translate(x + q[1] * s, y + q[2] * s + Math.sin(time * 2 + i) * 2); ctx.rotate(q[3]);
      card(-cs / 2, -cs / 2, cs, cs, cs * 0.16, '#FFFFFF', 'rgba(43,45,91,.25)', 4);
      text(q[0], 0, cs * 0.03, cs * 0.72, q[4], { weight: 'normal' });
      ctx.restore();
    });
  },
  balloon(x, y, s) {
    const b = Math.sin(time * 1.4) * s * 0.015;
    drawBalloon(x - s * 0.26, y + s * 0.0 + b, s * 0.19, C.yellow, 0, s * 0.2);
    drawBalloon(x + s * 0.27, y - s * 0.04 - b, s * 0.2, C.violet, 0, s * 0.2);
    drawBalloon(x, y - s * 0.14 + b * 0.5, s * 0.25, C.red, 0, s * 0.22);
  },
  firework(x, y, s) {
    miniBurst(x - s * 0.08, y - s * 0.07, s * 0.36, 0, [C.yellow, C.pink, '#FFFFFF']);
    miniBurst(x + s * 0.3, y + s * 0.25, s * 0.17, 0.4, [C.sky, C.green]);
  },
  peek(x, y, s) {
    const bs = s * 0.46, top = y + s * 0.14, e = bs * 0.92;
    drawGiftLid(x + bs * 0.08, top - bs * 0.62, bs, C.yellow, C.red, -0.14);
    ctx.save();
    ctx.beginPath(); ctx.rect(x - s, top - s * 2, s * 2, s * 2 + bs * 0.1); ctx.clip();
    drawAnimal('rabbit', x, top - e * 0.34 + Math.sin(time * 2.2) * 1.5, e);
    ctx.restore();
    drawGiftBody(x, top, bs, C.yellow, C.red);
  },
  mole(x, y, s) {
    const e = s * 0.52, cy = y + s * 0.26, rx = s * 0.34, ry = s * 0.105;
    drawHole(x, cy, rx, ry);
    ctx.save();
    clipHole(x, cy, rx, ry, s);
    drawAnimal('mole', x, cy - e * 0.42 + Math.sin(time * 2) * e * 0.03, e, { variant: 'y' });
    ctx.restore();
  },
  music(x, y, s) {
    const cols = [C.red, C.yellow, C.green, C.sky, C.violet], n = 5, bh = s * 0.105, gap = s * 0.035, tot = n * bh + (n - 1) * gap;
    ctx.strokeStyle = '#B9794B'; ctx.lineWidth = s * 0.05; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.22, y + tot / 2 + s * 0.02); ctx.lineTo(x - s * 0.11, y - tot / 2 - s * 0.02);
    ctx.moveTo(x + s * 0.22, y + tot / 2 + s * 0.02); ctx.lineTo(x + s * 0.11, y - tot / 2 - s * 0.02);
    ctx.stroke();
    for (let i = 0; i < n; i++) {
      const w = s * lerp(0.8, 0.44, i / (n - 1)), yy = y + tot / 2 - bh - i * (bh + gap);
      fillRR(x - w / 2, yy + 2.5, w, bh, bh * 0.4, shade(cols[i], -0.25));
      fillRR(x - w / 2, yy, w, bh, bh * 0.4, cols[i]);
    }
  },
  number(x, y, s) {
    const b = Math.sin(time * 1.5) * s * 0.012;
    drawNumBubble(x - s * 0.26, y + s * 0.1 - b, s * 0.19, C.red, 1);
    drawNumBubble(x + s * 0.28, y + s * 0.08 + b, s * 0.18, C.violet, 3);
    drawNumBubble(x, y - s * 0.12 + b, s * 0.23, C.yellow, 2);
  }
};

    TILE_ART[g.id](t.x + t.w / 2, y + 4 + artH / 2, Math.min(t.w * 0.92, artH), t.w);
    ctx.restore();
    nameTag(g.name, t.x + t.w / 2, y + t.h - tagH / 2 - 9, tagH);
  },
  update(dt) {
    for (const L of this.letters) {
      if (L.j < 0 || L.v) { L.v += L.d * 26 * dt; L.j += L.v * dt; if (L.j >= 0) { L.j = 0; L.v = 0; } }
    }
    for (const t of this.tiles) t.p += ((this.sel === t ? 1 : 0) - t.p) * Math.min(1, dt * 24);
    if (this.sel) {
      this.selT += dt;
      if (this.selT > 0.16) { const t = this.sel; this.sel = null; go(t.g.id, t.x + t.w / 2, t.y + t.h / 2); }
    }
  },
  down(p) {
    for (let i = 0; i < this.letters.length; i++) {
      const L = this.letters[i];
      if (Math.hypot(p.x - L.x, p.y - L.y) < L.d * 0.6) {
        L.v = -L.d * 5.5; L.j = -0.01;

    if (this.sel) return;

        this.sel = t; this.selT = 0;

        burstStars(p.x, p.y, 8, 1);

  },
  draw() {
    if (!this.layer) this.layer = makeLayer(() => this.paintBg());
    ctx.drawImage(this.layer, 0, 0, W, H);

      const L = this.letters[i];
      paperLetter(L.ch, L.x, L.y + L.j, L.d, RAINBOW[i % RAINBOW.length], (i % 2 ? 1 : -1) * 0.08);
    }
    for (const t of this.tiles) this.drawTile(t);
    drawToggle(soundBtn, 'おと', Sound.enabled);
    drawToggle(voiceBtn, 'こえ', Sound.enabled && Voice.enabled);
    drawToggle(setBtn, 'せってい', true, '#6B6FA0');
    if (!this.land) {
      /* おとな向けのひとこと */
      const fs = 11.5, a = 'あそびの とちゅうは 左上の', b = 'を 長押しで もどる';
      const wa = textW(a, fs), wb = textW(b, fs), total = wa + 22 + wb, x0 = W / 2 - total / 2, y = this.hintY;
      ctx.globalAlpha = 0.72;
      text(a, x0, y, fs, INK, { align: 'left' });
      circle(x0 + wa + 11, y, 7.5, INK);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      const hx = x0 + wa + 11;
      ctx.moveTo(hx, y - 4.4); ctx.lineTo(hx + 4.6, y - 0.4); ctx.lineTo(hx + 3.2, y - 0.4); ctx.lineTo(hx + 3.2, y + 3.8);
      ctx.lineTo(hx - 3.2, y + 3.8); ctx.lineTo(hx - 3.2, y - 0.4); ctx.lineTo(hx - 4.6, y - 0.4);
      ctx.closePath(); ctx.fill();
      text(b, x0 + wa + 22, y, fs, INK, { align: 'left' });
      ctx.globalAlpha = 1;
    }
  }
};

/* ================= ふうせん ================= */
const Balloon = {
  bgColor: '#8FD6FF',
  list: [], shows: [], clouds: [], layer: null, count: 0, bump: 0, spawnT: 0,
  enter() {
    this.list = []; this.shows = []; this.count = 0; this.bump = 0; this.spawnT = 0;
    this.clouds = [0, 1, 2, 3].map(i => ({ x: rand(W), y: safe.t + 96 + i * H * 0.15 + rand(-12, 12), s: rand(30, 52), v: rand(5, 12) }));
    const n = this.target();
    for (let i = 0; i < n; i++) this.spawn(true);
  },
  exit() { this.list = []; this.shows = []; this.layer = freeLayer(this.layer); },
  resize() {
    this.layer = freeLayer(this.layer);
    for (const b of this.list) b.x = clamp(b.x, b.r, Math.max(b.r, W - b.r));
  },
  target() { return clamp(Math.round(W * H / 48000), 5, 10); },
  spawn(initial) {
    const r = clamp(Math.min(W, H) * rand(0.125, 0.16), 44, 86);
    const lo = safe.l + r * 0.9, hi = Math.max(lo + 1, W - safe.r - r * 0.9);
    let x = rand(lo, hi);
    if (!initial) {
      /* 下のほうにいる風船となるべく重ならない場所をえらぶ */
      let best = -1;
      for (let k = 0; k < 6; k++) {
        const cx = rand(lo, hi);
        let d = 1e9;
        for (const o of this.list) if (o.y > H * 0.6) d = Math.min(d, Math.abs(o.x - cx));
        if (d > best) { best = d; x = cx; }
      }
    }
    this.list.push({
      r, x, y: initial ? rand(H * 0.2, H * 1.02) : H + r * 0.7,
      vy: (H + r * 4) / rand(8, 12), ph: rand(TAU), sw: rand(8, 20), sf: rand(0.5, 1),
      color: pick(RAINBOW), animal: Math.random() < 0.32 ? pick(ANIMALS) : null
    });
  },
  bx(b) { return b.x + Math.sin(time * b.sf + b.ph) * b.sw; },
  update(dt) {
    this.bump = Math.max(0, this.bump - dt * 4);
    for (const c of this.clouds) { c.x += c.v * dt; if (c.x > W + c.s * 2) c.x = -c.s * 2; }
    for (let i = this.list.length - 1; i >= 0; i--) {
      const b = this.list[i];
      b.y -= b.vy * dt;
      if (b.y < -b.r * 2.8) this.list.splice(i, 1);
    }
    const tg = this.target();
    if (this.list.length < tg) {   // たくさん割れたら早めにおかわり
      this.spawnT -= dt;
      if (this.spawnT <= 0) { this.spawn(false); this.spawnT = this.list.length < tg * 0.6 ? rand(0.08, 0.25) : rand(0.3, 0.8); }
    }
    for (let i = this.shows.length - 1; i >= 0; i--) { const s = this.shows[i]; s.t += dt; if (s.t > 1.7) this.shows.splice(i, 1); }
  },
  down(p) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const b = this.list[i], x = this.bx(b), dx = p.x - x, dy = p.y - b.y, rx = b.r * 0.86 + 16, ry = b.r + 16;
      if (dx * dx / (rx * rx) + dy * dy / (ry * ry) <= 1) { this.pop(i, x); return; }
    }
    tapSparkle(p.x, p.y);
  },
  pop(i, x) {
    const b = this.list[i];
    this.list.splice(i, 1);
    this.count++; this.bump = 1;
    Sound.pop(clamp(62 / b.r, 0.7, 1.4));
    Sound.chime();
    burstConfetti(x, b.y, 14, 0.9, [b.color, shade(b.color, 0.35), shade(b.color, -0.15), '#FFFFFF']);
    ringFx(x, b.y, b.r * 1.25, '#fff', 7, 0.36);
    if (b.animal) {
      const s = clamp(b.r * 1.5, 72, 124);
      this.shows.push({ a: b.animal, s, t: 0, x: clamp(x, s * 0.95, Math.max(s * 0.95, W - s * 0.95)), y: clamp(b.y, safe.t + 60 + s, Math.max(safe.t + 60 + s, H - safe.b - s * 1.2)) });
      Sound.boing();
      if (this.count % 10) Voice.say(aSay(b.animal) + '！');
    }
    if (this.count % 10 === 0) celebrate();
  },
  paintBg() {
    ctx.fillStyle = this.bgColor; ctx.fillRect(0, 0, W, H);
    const sr = clamp(Math.min(W, H) * 0.075, 26, 44), sx = W - safe.r - sr * 1.9, sy = safe.t + 34 + sr * 1.6;
    ctx.fillStyle = C.orange;
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * TAU;
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a - 0.17) * sr * 1.14, sy + Math.sin(a - 0.17) * sr * 1.14);
      ctx.lineTo(sx + Math.cos(a) * sr * 1.62, sy + Math.sin(a) * sr * 1.62);
      ctx.lineTo(sx + Math.cos(a + 0.17) * sr * 1.14, sy + Math.sin(a + 0.17) * sr * 1.14);
      ctx.closePath(); ctx.fill();
    }
    circle(sx, sy, sr, C.yellow);
  },
  draw() {
    if (!this.layer) this.layer = makeLayer(() => this.paintBg());
    ctx.drawImage(this.layer, 0, 0, W, H);
    for (const c of this.clouds) drawCloud(c.x, c.y, c.s);
    for (const b of this.list) {
      const x = this.bx(b);
      drawBalloon(x, b.y, b.r, b.color, Math.cos(time * b.sf + b.ph) * b.sw * 0.5);
      if (b.animal) drawAnimal(b.animal.id, x - b.r * 0.03, b.y + b.r * 0.02, b.r * 0.8);
    }
    /* てまえの丘（ふうせんは丘のうしろから出てくる） */
    oval(W * 0.2, H + H * 0.035, W * 0.62, H * 0.12, '#86D46B');
    oval(W * 0.82, H + H * 0.045, W * 0.6, H * 0.1, '#6BC258');
    for (const s of this.shows) {
      const k = outBack(Math.min(1, s.t / 0.3)), yy = s.y - outCubic(Math.min(1, s.t / 0.8)) * 24;
      ctx.globalAlpha = s.t > 1.35 ? clamp(1 - (s.t - 1.35) / 0.35, 0, 1) : 1;
      drawAnimal(s.a.id, s.x, yy, s.s * (0.55 + 0.45 * k), { mood: 1 });
      nameTag(s.a.name, s.x, yy + s.s * 0.78, clamp(s.s * 0.3, 24, 36));
      ctx.globalAlpha = 1;
    }
    drawCounter(this.count, this.bump, (x, y) => drawBalloon(x, y - 2, 11, C.red, 0, 0));
  }
};

/* ================= はなび ================= */
const FW_TYPES = ['ball', 'ball', 'ring', 'double', 'heart', 'star', 'willow', 'smile'];
const Firework = {
  bgColor: '#20225A',
  sp: [], fl: [], tw: [], trail: new Map(), layer: null, idle: 0, autoT: 0, cnt: 0, fizzT: 0,
  enter() {
    this.sp = []; this.fl = []; this.trail = new Map();
    this.idle = 9; this.autoT = 0.45; this.cnt = 0; this.fizzT = 0;
    this.tw = [];
    for (let i = 0; i < 14; i++) this.tw.push({ x: rand(W), y: rand(H * 0.72), p: rand(TAU), s: rand(3, 6) });
  },
  exit() { this.sp = []; this.fl = []; this.layer = freeLayer(this.layer); },
  resize() { this.layer = freeLayer(this.layer); for (const t of this.tw) { t.x = rand(W); t.y = rand(H * 0.72); } },
  add(x, y, vx, vy, h, life, w, g, k) {
    const sp = this.sp;
    if (sp.length > 860) sp.splice(0, sp.length - 860);
    sp.push({ x, y, tx: x, ty: y, vx, vy, h, life, max: life, w, g, k, tw: Math.random() });
  },
  burst(x, y, vol) {
    const R = Math.min(W, H) * rand(0.27, 0.4), K = 2.3, v = R * K;
    const h1 = rand(360), h2 = (h1 + rand(50, 200)) % 360;
    const type = pick(FW_TYPES);
    const A = (ux, uy, h, life, w, g, k) => this.add(x, y, ux * v, uy * v, h, life || rand(1.0, 1.4), w || 3.4, g === undefined ? 70 : g, k || K);
    if (type === 'ball') {
      for (let i = 0; i < 52; i++) { const a = rand(TAU), s = 0.25 + 0.75 * Math.sqrt(Math.random()); A(Math.cos(a) * s, Math.sin(a) * s, Math.random() < 0.6 ? h1 : h2); }
    } else if (type === 'ring') {
      for (let i = 0; i < 36; i++) { const a = i / 36 * TAU; A(Math.cos(a), Math.sin(a), h1); }
      for (let i = 0; i < 14; i++) { const a = rand(TAU), s = rand(0.15, 0.45); A(Math.cos(a) * s, Math.sin(a) * s, h2); }
    } else if (type === 'double') {
      for (let i = 0; i < 30; i++) { const a = i / 30 * TAU; A(Math.cos(a), Math.sin(a), h1); A(Math.cos(a + 0.1) * 0.58, Math.sin(a + 0.1) * 0.58, h2); }
    } else if (type === 'heart') {
      for (let i = 0; i < 44; i++) {
        const t = i / 44 * TAU;
        A(Math.pow(Math.sin(t), 3), -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16, 335 + rand(-12, 12), 1.35);
      }
    } else if (type === 'star') {
      const P = [];
      for (let i = 0; i < 10; i++) { const a = -PI / 2 + i * PI / 5, r = i % 2 ? 0.45 : 1; P.push([Math.cos(a) * r, Math.sin(a) * r]); }
      for (let i = 0; i < 10; i++) { const p = P[i], q = P[(i + 1) % 10]; for (let j = 0; j < 5; j++) A(lerp(p[0], q[0], j / 5), lerp(p[1], q[1], j / 5), 48 + rand(-6, 6), 1.3); }
    } else if (type === 'willow') {
      for (let i = 0; i < 46; i++) { const a = rand(TAU), s = 0.3 + 0.7 * Math.sqrt(Math.random()); A(Math.cos(a) * s * 0.9, Math.sin(a) * s * 0.9 - 0.15, 42 + rand(-8, 10), rand(1.7, 2.3), 2.8, 190, 1.7); }
    } else {  // にこにこマーク
      for (let i = 0; i < 30; i++) { const a = i / 30 * TAU; A(Math.cos(a), Math.sin(a), 50); }
      for (const ex of [-0.36, 0.36]) for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; A(ex + Math.cos(a) * 0.07, -0.28 + Math.sin(a) * 0.07, 195); }
      for (let i = 0; i <= 10; i++) { const a = PI * (0.18 + 0.64 * i / 10); A(Math.cos(a) * 0.6, Math.sin(a) * 0.6 - 0.02, 340); }
    }
    this.fl.push({ x, y, t: 0, h: h1, r: R * 0.4 });
    Sound.boom(vol);
  },
  update(dt) {
    this.idle += dt;
    /* さわっていない間は、ときどき自動であがる（20秒たったら音はなし） */
    if (this.idle > 2.5) {
      this.autoT -= dt;
      if (this.autoT <= 0) {
        this.burst(rand(W * 0.15, W * 0.85), rand(safe.t + H * 0.1, H * 0.55), this.idle > 20 ? 0 : 0.3);
        this.autoT = rand(1.1, 2.4);
      }
    }
    const sp = this.sp;
    for (let i = sp.length - 1; i >= 0; i--) {
      const s = sp[i];
      s.life -= dt;
      if (s.life <= 0) { sp[i] = sp[sp.length - 1]; sp.pop(); continue; }
      const d = Math.exp(-s.k * dt);
      s.vx *= d; s.vy = s.vy * d + s.g * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      const f = 1 - Math.exp(-dt * 9);
      s.tx += (s.x - s.tx) * f; s.ty += (s.y - s.ty) * f;
    }
    for (let i = this.fl.length - 1; i >= 0; i--) { this.fl[i].t += dt; if (this.fl[i].t > 0.2) this.fl.splice(i, 1); }
  },
  down(p) {
    this.idle = 0;
    this.burst(p.x, p.y, 1);
    this.trail.set(p.id, { x: p.x, y: p.y, h: rand(360) });
    this.cnt++;
    if (this.cnt % 12 === 0) Voice.say('たまやー！');
  },
  move(p) {
    const last = this.trail.get(p.id);
    if (!last) return;
    const dx = p.x - last.x, dy = p.y - last.y, d = Math.hypot(dx, dy);
    if (d < 14) return;
    this.idle = 0;
    const n = Math.min(4, (d / 14) | 0);
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / n, a = rand(TAU), v = rand(30, 130);
      this.add(last.x + dx * t, last.y + dy * t, Math.cos(a) * v, Math.sin(a) * v, last.h + rand(-20, 20), rand(0.35, 0.7), 2.6, 160, 2.5);
    }
    last.x = p.x; last.y = p.y;
    if (time - this.fizzT > 0.09) { this.fizzT = time; Sound.fizz(); }
  },
  up(p) { this.trail.delete(p.id); },
  paintBg() {
    ctx.fillStyle = this.bgColor; ctx.fillRect(0, 0, W, H);
    const n = Math.round(W * H / 5200);
    for (let i = 0; i < n; i++) { ctx.globalAlpha = rand(0.35, 0.9); circle(rand(W), rand(H * 0.8), rand(0.7, 1.7), '#FFE9A8'); }
    ctx.globalAlpha = 1;
    const mr = clamp(Math.min(W, H) * 0.075, 24, 46), mx = W - safe.r - mr * 2, my = safe.t + 36 + mr * 1.3;
    circle(mx, my, mr, '#FFE9A8');
    circle(mx - mr * 0.3, my - mr * 0.25, mr * 0.2, '#F3D98C');
    circle(mx + mr * 0.35, my + mr * 0.3, mr * 0.28, '#F3D98C');
    circle(mx + mr * 0.25, my - mr * 0.5, mr * 0.11, '#F3D98C');
    /* 丘とまちのあかり */
    oval(W * 0.25, H + H * 0.02, W * 0.7, H * 0.14, '#191B4E');
    oval(W * 0.85, H + H * 0.03, W * 0.62, H * 0.12, '#141640');
    const hs = clamp(Math.min(W, H) * 0.06, 20, 34), base = H - H * 0.085;
    [[0.14, 1], [0.3, 0.8], [0.72, 0.9], [0.88, 1.1]].forEach((q, i) => {
      const x = W * q[0], s = hs * q[1], y = base + (i < 2 ? -H * 0.02 : H * 0.012);
      ctx.fillStyle = '#0E0F30';
      ctx.fillRect(x - s / 2, y - s * 0.7, s, s * 1.4);
      ctx.beginPath(); ctx.moveTo(x - s * 0.66, y - s * 0.7); ctx.lineTo(x, y - s * 1.3); ctx.lineTo(x + s * 0.66, y - s * 0.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.yellow;
      ctx.fillRect(x - s * 0.28, y - s * 0.42, s * 0.22, s * 0.26); ctx.fillRect(x + s * 0.06, y - s * 0.42, s * 0.22, s * 0.26);
    });
  },
  draw() {
    if (!this.layer) this.layer = makeLayer(() => this.paintBg());
    ctx.drawImage(this.layer, 0, 0, W, H);
    for (const t of this.tw) {   // またたく星
      const a = 0.5 + 0.5 * Math.sin(time * 2.2 + t.p);
      ctx.globalAlpha = 0.25 + 0.75 * a;
      ctx.fillStyle = '#FFF6D0';
      ctx.beginPath();
      const s = t.s * (0.7 + 0.3 * a), q = s * 0.22;
      ctx.moveTo(t.x, t.y - s); ctx.lineTo(t.x + q, t.y - q); ctx.lineTo(t.x + s, t.y); ctx.lineTo(t.x + q, t.y + q);
      ctx.lineTo(t.x, t.y + s); ctx.lineTo(t.x - q, t.y + q); ctx.lineTo(t.x - s, t.y); ctx.lineTo(t.x - q, t.y - q);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const f of this.fl) {
      const k = f.t / 0.2;
      ctx.globalAlpha = (1 - k) * 0.4;
      circle(f.x, f.y, f.r * (0.35 + 0.65 * k), 'hsl(' + (f.h | 0) + ',100%,82%)');
    }
    ctx.globalAlpha = 1;
    for (const s of this.sp) {
      const f = s.life / s.max;
      let a = f < 0.35 ? f / 0.35 : 1;
      if (f < 0.45) a *= 0.55 + 0.45 * Math.sin(time * 38 + s.tw * 40);
      ctx.strokeStyle = 'hsla(' + (s.h | 0) + ',100%,63%,' + a.toFixed(2) + ')';
      ctx.lineWidth = s.w * (0.55 + 0.45 * f);
      ctx.beginPath(); ctx.moveTo(s.tx, s.ty); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    ctx.restore();
  }
};

/* ================= どうぶつ（はこから ばあ！） ================= */
const BOX_COLORS = [[C.red, '#FFE08A'], [C.yellow, '#FF5A4E'], [C.sky, '#FFFFFF'], [C.green, '#FFE08A'], [C.violet, '#FFCB3D'], [C.orange, '#FFFFFF'], [C.blue, '#FF8FB8']];
const Peek = {
  bgColor: '#FFA8BE',
  cells: [], layer: null, wigT: 0,
  enter() {
    this.cells = [];
    const pool = shuffle(ANIMALS.slice());
    for (let i = 0; i < 6; i++) this.cells.push({ st: 0, t: 0, a: pool[i], col: BOX_COLORS[i % BOX_COLORS.length], wig: 0, jump: 1, stay: 3 });
    this.wigT = 1; this.opens = 0; this.cheerT = -1;
    this.layout();
  },
  exit() { this.layer = freeLayer(this.layer); },
  resize() { this.layout(); },
  layout() {
    this.layer = freeLayer(this.layer);
    const land = W > H * 1.05, cols = land ? 3 : 2, rows = land ? 2 : 3;
    const top = safe.t + 58, bot = H - Math.max(safe.b, 8) - 6, left = safe.l + 8, right = W - safe.r - 8;
    const cw = (right - left) / cols, ch = (bot - top) / rows;
    const s = Math.max(30, Math.min(cw * 0.6, (ch - 44) / 1.9));
    this.cells.forEach((c, i) => {
      c.x0 = left + (i % cols) * cw; c.y0 = top + Math.floor(i / cols) * ch; c.w = cw; c.h = ch;
      c.cx = c.x0 + cw / 2; c.s = s; c.e = s * 0.92;
      c.tagH = clamp(s * 0.31, 20, 32);
      c.top = c.y0 + ch - c.tagH - 12 - s * 0.66;
    });
  },
  nextAnimal(c) {
    const used = this.cells.map(x => x.a), pool = ANIMALS.filter(a => used.indexOf(a) < 0);
    c.a = pick(pool.length ? pool : ANIMALS);
    c.col = pick(BOX_COLORS.filter(k => k !== c.col));
  },
  update(dt) {
    if (this.cheerT > 0) { this.cheerT -= dt; if (this.cheerT <= 0) celebrate(); }
    this.wigT -= dt;
    if (this.wigT <= 0) {   // しまっている箱が「ここだよ」とゆれる
      const closed = this.cells.filter(c => c.st === 0 && c.wig <= 0);
      if (closed.length) pick(closed).wig = 0.7;
      this.wigT = rand(1.3, 2.4);
    }
    for (const c of this.cells) {
      c.wig = Math.max(0, c.wig - dt);
      if (c.jump < 1) c.jump = Math.min(1, c.jump + dt / 0.45);
      c.t += dt;
      if (c.st === 1 && c.t >= 0.4) { c.st = 2; c.t = 0; }
      else if (c.st === 2 && c.t >= c.stay) { c.st = 3; c.t = 0; Sound.hide(); }
      else if (c.st === 3 && c.t >= 0.3) { c.st = 0; c.t = 0; this.nextAnimal(c); }
    }
  },
  down(p) {
    let c = null;
    for (const k of this.cells) if (p.x >= k.x0 && p.x < k.x0 + k.w && p.y >= k.y0 && p.y < k.y0 + k.h) { c = k; break; }
    if (!c) { tapSparkle(p.x, p.y); return; }
    if (c.st === 0 || c.st === 3) {
      c.st = 1; c.t = 0; c.stay = 3; c.wig = 0; c.jump = 1;
      Sound.pop(1.1); Sound.boing();
      burstConfetti(c.cx, c.top, 14, 0.8);
      Voice.say(aSay(c.a) + '！ ' + c.a.call + '！');
      this.opens++;
      if (this.opens % 6 === 0) this.cheerT = 1.4;   // どうぶつの声のあとで ほめる
    } else {
      c.jump = 0;
      if (c.st === 2) c.stay = Math.max(c.stay, c.t + 2);
      Sound.boing(); Sound.chime();
      burstStars(c.cx, c.top - c.e * 0.4, 7, 0.9);
      Voice.say(c.a.call + '！');
    }
  },
  paintBg() {
    ctx.fillStyle = this.bgColor; ctx.fillRect(0, 0, W, H);
    for (let y = 26, row = 0; y < H + 40; y += 78, row++) {
      for (let x = (row % 2 ? 58 : 19); x < W + 40; x += 78) circle(x, y, 13, '#FFB6C9');
    }
    /* はたのかざり */
    const y0 = safe.t + 8, sag = 26, n = Math.max(7, Math.round(W / 46));
    const py = t => y0 + sag * 4 * t * (1 - t);
    ctx.strokeStyle = 'rgba(43,45,91,.45)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) { const t = i / 40; if (i) ctx.lineTo(W * t, py(t)); else ctx.moveTo(0, py(0)); }
    ctx.stroke();
    for (let i = 0; i < n; i++) {
      const t0 = (i + 0.12) / n, t1 = (i + 0.88) / n, tm = (t0 + t1) / 2;
      ctx.fillStyle = RAINBOW[(i * 3) % RAINBOW.length];
      ctx.beginPath(); ctx.moveTo(W * t0, py(t0)); ctx.lineTo(W * t1, py(t1)); ctx.lineTo(W * tm, py(tm) + (W / n) * 0.8); ctx.closePath(); ctx.fill();
    }
  },
  draw() {
    if (!this.layer) this.layer = makeLayer(() => this.paintBg());
    ctx.drawImage(this.layer, 0, 0, W, H);
    for (let i = 0; i < this.cells.length; i++) {
      const c = this.cells[i], s = c.s, e = c.e;
      const o = c.st === 0 ? 0 : c.st === 1 ? outBack(Math.min(1, c.t / 0.4)) : c.st === 2 ? 1 : 1 - inOut(Math.min(1, c.t / 0.3));
      const wig = c.wig > 0 ? Math.sin(c.wig * 24) * 0.07 * (c.wig / 0.7) : 0;
      const jk = c.jump < 1 ? Math.sin(PI * c.jump) : 0;
      const ay = lerp(c.top + e * 0.6, c.top - e * (0.34 + (c.a.lift || 0)), o) + (c.st === 2 ? Math.sin(time * 3 + i) * 2.5 : 0) - jk * e * 0.26;
      const lidX = c.cx + s * 0.08 * o, lidY = lerp(c.top - s * 0.06, c.top - s * 0.62, o) - jk * e * 0.2, lidRot = -0.14 * Math.min(1, o);
      ctx.save();
      if (wig) { ctx.translate(c.cx, c.top + s * 0.66); ctx.rotate(wig); ctx.translate(-c.cx, -(c.top + s * 0.66)); }
      if (o > 0.12) drawGiftLid(lidX, lidY, s, c.col[0], c.col[1], lidRot);
      if (o > 0.001) {
        ctx.save();
        ctx.beginPath(); ctx.rect(c.cx - s * 1.5, c.top - s * 3, s * 3, s * 3 + s * 0.09); ctx.clip();
        drawAnimal(c.a.id, c.cx, ay, e, { mood: jk > 0.05 ? 1 : 0, sx: 1 + jk * 0.06, sy: 1 + jk * 0.1 });
        ctx.restore();
      }
      drawGiftBody(c.cx, c.top, s, c.col[0], c.col[1]);
      if (o <= 0.12) drawGiftLid(lidX, lidY, s, c.col[0], c.col[1], lidRot);
      ctx.restore();
      if (o > 0.5) {
        ctx.globalAlpha = clamp((o - 0.5) * 2.5, 0, 1);
        nameTag(c.a.name, c.cx, c.top + s * 0.66 + c.tagH / 2 + 9, c.tagH);
        ctx.globalAlpha = 1;
      }
    }
  }
};

/* ================= もぐらたたき ================= */
const Mole = {
  bgColor: '#86D46B',
  holes: [], layer: null, score: 0, bump: 0, next: 0, level: 0, lastHole: -1,
  enter() {
    this.holes = [];
    for (let i = 0; i < 9; i++) this.holes.push({ st: 0, t: 0, stay: 2, v: 'y' });
    this.score = 0; this.bump = 0; this.next = 0.5; this.level = 0; this.lastHole = -1;
    this.layout();
  },
  exit() { this.layer = freeLayer(this.layer); },
  resize() { this.layout(); },
  layout() {
    this.layer = freeLayer(this.layer);
    const top = safe.t + 66, bot = H - Math.max(safe.b, 8) - 10, left = safe.l + 6, right = W - safe.r - 6;
    const cw = (right - left) / 3, ch = (bot - top) / 3;
    const w = Math.max(40, Math.min(cw * 0.96, ch * 0.92));
    this.holes.forEach((h, i) => {
      h.cx = left + cw * (i % 3 + 0.5); h.cw = cw;
      h.e = w * 0.68; h.rx = w * 0.38; h.ry = w * 0.135;
      h.cy = top + ch * (Math.floor(i / 3) + 0.5) + h.e * 0.42;
    });
  },
  update(dt) {
    this.bump = Math.max(0, this.bump - dt * 4);
    /* じょうずな子には少しずつ速く、むずかしそうならゆっくりに */
    const L = this.level, maxUp = L < 0.35 ? 2 : 3;
    let up = 0;
    for (const h of this.holes) {
      if (h.st !== 0) up++;
      h.t += dt;
      if (h.st === 1 && h.t >= 0.22) { h.st = 2; h.t = 0; }
      else if (h.st === 2 && h.t >= h.stay) { h.st = 4; h.t = 0; this.level = Math.max(0, this.level - 0.07); }
      else if (h.st === 3 && h.t >= 0.5) { h.st = 0; h.t = 0; }
      else if (h.st === 4 && h.t >= 0.2) { h.st = 0; h.t = 0; }
    }
    this.next -= dt;
    if (this.next <= 0 && up < maxUp) {
      const free = [];
      this.holes.forEach((h, i) => { if (h.st === 0 && i !== this.lastHole) free.push(i); });
      if (free.length) {
        const i = pick(free), h = this.holes[i];
        this.lastHole = i;
        h.st = 1; h.t = 0; h.stay = lerp(2.8, 1.15, L) * rand(0.9, 1.15); h.v = pick(['y', 'y', 'r', 'b']);
        Sound.rise();
      }
      this.next = lerp(1.25, 0.5, L) * rand(0.8, 1.2);
    }
  },
  vis(h) {
    if (h.st === 1) return outBack(Math.min(1, h.t / 0.22));
    if (h.st === 2) return 1;
    if (h.st === 3) return h.t < 0.2 ? 1 : 1 - inOut(Math.min(1, (h.t - 0.2) / 0.3));
    if (h.st === 4) return 1 - h.t / 0.2;
    return 0;
  },
  down(p) {
    for (const h of this.holes) {
      if ((h.st === 1 || h.st === 2) && Math.abs(p.x - h.cx) < h.cw * 0.5 && p.y > h.cy - h.e * 1.3 && p.y < h.cy + h.ry + 16) {
        h.st = 3; h.t = 0;
        this.score++; this.bump = 1;
        this.level = Math.min(1, this.level + 0.05);
        Sound.bonk();
        const y = h.cy - h.e * 0.5;
        burstStars(h.cx, y, 9, 1.1, [C.yellow, '#FFFFFF', C.orange]);
        ringFx(h.cx, y, h.e * 0.8, '#fff', 6, 0.35);
        if (this.score % 5 === 0) celebrate();
        return;
      }
    }
    tapSparkle(p.x, p.y);
  },
  paintBg() {
    ctx.fillStyle = this.bgColor; ctx.fillRect(0, 0, W, H);
    /* しばふ */
    const n = Math.round(W * H / 5200);
    for (let i = 0; i < n; i++) {
      const x = rand(W), y = rand(H), s = rand(5, 9);
      ctx.fillStyle = i % 3 ? '#74C65B' : '#9BDE80';
      ctx.beginPath(); ctx.moveTo(x - s * 0.6, y); ctx.lineTo(x - s * 0.25, y - s); ctx.lineTo(x, y - s * 0.2); ctx.lineTo(x + s * 0.3, y - s * 1.2); ctx.lineTo(x + s * 0.6, y); ctx.closePath(); ctx.fill();
    }
    /* おはな */
    const m = Math.round(W * H / 26000);
    for (let i = 0; i < m; i++) {
      const x = rand(12, W - 12), y = rand(safe.t + 50, H - 12), r = rand(3.2, 4.6), col = pick(['#FFFFFF', '#FFFFFF', '#FFD3E0', '#FFF3A8']);
      for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; circle(x + Math.cos(a) * r * 1.15, y + Math.sin(a) * r * 1.15, r, col); }
      circle(x, y, r * 0.85, C.yellow);
    }
    for (const h of this.holes) drawHole(h.cx, h.cy, h.rx, h.ry);
  },
  draw() {
    if (!this.layer) this.layer = makeLayer(() => this.paintBg());
    ctx.drawImage(this.layer, 0, 0, W, H);
    for (const h of this.holes) {
      if (h.st === 0) continue;
      const v = this.vis(h), e = h.e;
      const y = lerp(h.cy + e * 0.75, h.cy - e * 0.42, v) + (h.st === 2 ? Math.sin(time * 5 + h.cx) * 1.5 : 0);
      const sq = h.st === 3 ? Math.max(0, 1 - h.t / 0.2) : 0;   // たたかれて ぺちゃんこ
      ctx.save();
      clipHole(h.cx, h.cy, h.rx, h.ry, e * 1.4);
      drawAnimal('mole', h.cx, y + sq * e * 0.14, e, { mood: h.st === 3 ? 2 : 0, variant: h.v, sx: 1 + sq * 0.14, sy: 1 - sq * 0.22 });
      ctx.restore();
      if (h.st === 3 && h.t < 0.45) {   // くるくる星
        for (let k = 0; k < 3; k++) {
          const a = time * 9 + k * TAU / 3;
          star(h.cx + Math.cos(a) * e * 0.42, y - e * 0.62 + Math.sin(a) * e * 0.1, e * 0.07, C.yellow, a);
        }
      }
    }
    drawCounter(this.score, this.bump, (x, y) => star(x, y, 10, C.yellow));
  }
};

/* ================= がっき（もっきん＋たいこ） ================= */
const BAR_NAMES = ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ', 'ド'];
const WOOD = '#B9794B';
const Music = {
  bgColor: '#FFF3D6',
  bars: [], pads: [], last: new Map(), layer: null, land: false, area: null,
  enter() {
    this.bars = [];
    for (let i = 0; i < 8; i++) this.bars.push({ i, hit: 0 });
    this.pads = ['drum', 'cymbal', 'bell', 'star'].map(k => ({ k, hit: 0 }));
    this.last = new Map();
    this.layout();
  },
  exit() { this.layer = freeLayer(this.layer); },
  resize() { this.layout(); },
  layout() {
    this.layer = freeLayer(this.layer);
    const land = this.land = W > H * 1.05;
    const top = safe.t + 60, bot = H - Math.max(safe.b, 8) - 8, left = safe.l + 12, right = W - safe.r - 12;
    const padR = clamp(Math.min(W, H) * 0.105, 32, 58), padRow = padR * 2 + 24;
    const bTop = top, bBot = bot - padRow, n = 8;
    const gap = clamp((land ? right - left : bBot - bTop) * 0.014, 5, 12);
    this.bars.forEach((b, i) => {
      const k = i / (n - 1);   // 0 = ひくいド
      if (land) {
        const bw = (right - left - gap * (n - 1)) / n, len = (bBot - bTop) * lerp(1, 0.62, k);
        b.x = left + i * (bw + gap); b.y = (bTop + bBot) / 2 - len / 2; b.w = bw; b.h = len;
      } else {
        const bh = (bBot - bTop - gap * (n - 1)) / n, len = (right - left) * lerp(1, 0.6, k);
        b.x = (left + right) / 2 - len / 2; b.y = bBot - bh - i * (bh + gap); b.w = len; b.h = bh;
      }
    });
    const span = Math.min(right - left, padR * 8 + 3 * 30), py = bot - padR - 8;
    this.pads.forEach((p, i) => { p.r = padR; p.x = (left + right) / 2 - span / 2 + padR + i * ((span - padR * 2) / 3); p.y = py; });
    this.area = { left, right, bTop, bBot };
  },
  barAt(x, y) {
    const a = this.area;
    if (x < a.left - 14 || x > a.right + 14 || y < a.bTop - 8 || y > a.bBot + 8) return -1;
    const i = this.land ? Math.floor((x - a.left) / ((a.right - a.left) / 8)) : Math.floor((a.bBot - y) / ((a.bBot - a.bTop) / 8));
    return clamp(i, 0, 7);
  },
  ring(i, x, y) {
    const b = this.bars[i];
    b.hit = 1;
    Sound.note(DOREMI[i], 0.42, 1.0);
    ringFx(x, y, 36, '#fff', 5, 0.32);
    addPart({ k: 'note', x, y: y - 10, vx: rand(-40, 40), vy: -rand(130, 190), drag: 1.2, rot: rand(TAU), vr: 6, life: 0.9, size: 30, color: RAINBOW[i] });
  },
  update(dt) {
    for (const b of this.bars) b.hit = Math.max(0, b.hit - dt * 5);
    for (const p of this.pads) p.hit = Math.max(0, p.hit - dt * 5);
  },
  down(p) {
    const i = this.barAt(p.x, p.y);
    this.last.set(p.id, i);
    if (i >= 0) { this.ring(i, p.x, p.y); return; }
    for (const pad of this.pads) {
      if (Math.hypot(p.x - pad.x, p.y - pad.y) < pad.r + 10) {
        pad.hit = 1;
        if (pad.k === 'drum') Sound.drum(); else if (pad.k === 'cymbal') Sound.cymbal(); else if (pad.k === 'bell') Sound.bell(); else Sound.sparkle();
        if (pad.k === 'star') burstStars(pad.x, pad.y, 10, 1.2, [C.yellow, '#FFFFFF', C.pink]);
        else ringFx(pad.x, pad.y, pad.r * 1.5, pad.k === 'drum' ? C.red : pad.k === 'cymbal' ? C.orange : C.violet, 6, 0.4);
        return;
      }
    }
    tapSparkle(p.x, p.y);
  },
  move(p) {   // ゆびをすべらせると じゅんばんに鳴る
    const i = this.barAt(p.x, p.y), prev = this.last.get(p.id);
    if (i >= 0 && i !== prev) this.ring(i, p.x, p.y);
    this.last.set(p.id, i);
  },
  up(p) { this.last.delete(p.id); },
  paintBg() {
    ctx.fillStyle = this.bgColor; ctx.fillRect(0, 0, W, H);
    for (let y = 30, row = 0; y < H + 40; y += 84, row++) {
      for (let x = (row % 2 ? 62 : 20); x < W + 40; x += 84) circle(x, y, 15, '#FFEBC0');
    }
    if (safe.t > 20) { ctx.fillStyle = WOOD; ctx.fillRect(0, 0, W, safe.t + 4); }
    /* 木のわく */
    const lo = this.bars[0], hi = this.bars[7];
    ctx.strokeStyle = WOOD; ctx.lineCap = 'round';
    ctx.lineWidth = clamp(Math.min(W, H) * 0.035, 10, 18);
    ctx.beginPath();
    if (this.land) {
      const cy = lo.y + lo.h / 2;
      for (const s of [-1, 1]) { ctx.moveTo(lo.x - 4, cy + s * lo.h * 0.32); ctx.lineTo(hi.x + hi.w + 4, cy + s * hi.h * 0.32); }
    } else {
      const cx = lo.x + lo.w / 2;
      for (const s of [-1, 1]) { ctx.moveTo(cx + s * lo.w * 0.32, lo.y + lo.h + 4); ctx.lineTo(cx + s * hi.w * 0.32, hi.y - 4); }
    }
    ctx.stroke();
  },
  drawPad(p) {
    const r = p.r, dy = p.hit * 4;
    const base = p.k === 'drum' ? C.red : p.k === 'cymbal' ? C.yellow : p.k === 'bell' ? C.violet : C.sky;
    circle(p.x, p.y + 6, r, shade(base, -0.28));
    const y = p.y + dy;
    circle(p.x, y, r, base);
    if (p.k === 'drum') {
      circle(p.x, y, r * 0.74, '#FFF3D6');
      ctx.strokeStyle = WOOD; ctx.lineWidth = r * 0.1; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x - r * 0.36, y + r * 0.3); ctx.lineTo(p.x + r * 0.22, y - r * 0.3);
      ctx.moveTo(p.x + r * 0.36, y + r * 0.3); ctx.lineTo(p.x - r * 0.22, y - r * 0.3);
      ctx.stroke();
      circle(p.x + r * 0.25, y - r * 0.33, r * 0.11, WOOD); circle(p.x - r * 0.25, y - r * 0.33, r * 0.11, WOOD);
    } else if (p.k === 'cymbal') {
      ctx.strokeStyle = shade(C.yellow, -0.2); ctx.lineWidth = r * 0.06;
      for (const k of [0.78, 0.56]) { ctx.beginPath(); ctx.arc(p.x, y, r * k, 0, TAU); ctx.stroke(); }
      circle(p.x, y, r * 0.2, shade(C.yellow, -0.2));
      oval(p.x - r * 0.4, y - r * 0.42, r * 0.1, r * 0.24, 'rgba(255,255,255,.7)', 0.8);
    } else if (p.k === 'bell') {
      const s = r * 0.52;
      ctx.fillStyle = C.yellow;
      ctx.beginPath();
      ctx.moveTo(p.x - s * 1.05, y + s * 0.62);
      ctx.quadraticCurveTo(p.x - s * 0.62, y + s * 0.3, p.x - s * 0.6, y - s * 0.2);
      ctx.arc(p.x, y - s * 0.2, s * 0.6, PI, TAU);
      ctx.quadraticCurveTo(p.x + s * 0.62, y + s * 0.3, p.x + s * 1.05, y + s * 0.62);
      ctx.closePath(); ctx.fill();
      circle(p.x, y + s * 0.82, s * 0.24, C.orange);
      circle(p.x, y - s * 0.86, s * 0.16, C.yellow);
    } else {
      star(p.x, y, r * 0.48, C.yellow, Math.sin(p.hit * PI) * 0.4);
    }
  },
  draw() {
    if (!this.layer) this.layer = makeLayer(() => this.paintBg());
    ctx.drawImage(this.layer, 0, 0, W, H);
    for (const b of this.bars) {
      const col = RAINBOW[b.i], dy = b.hit * 4, r = Math.min(b.w, b.h) * 0.3;
      fillRR(b.x, b.y + 6, b.w, b.h, r, shade(col, -0.28));
      fillRR(b.x, b.y + dy, b.w, b.h, r, col);
      if (b.hit > 0) { ctx.globalAlpha = b.hit * 0.45; fillRR(b.x, b.y + dy, b.w, b.h, r, '#fff'); ctx.globalAlpha = 1; }
      const cx = b.x + b.w / 2, cy = b.y + dy + b.h / 2, q = Math.min(b.w, b.h);
      if (this.land) {
        circle(cx, b.y + dy + b.h * 0.14, q * 0.09, 'rgba(43,45,91,.28)'); circle(cx, b.y + dy + b.h * 0.86, q * 0.09, 'rgba(43,45,91,.28)');
        text(BAR_NAMES[b.i], cx, cy, clamp(q * 0.36, 13, 26), '#fff');
      } else {
        circle(b.x + b.w * 0.07, cy, q * 0.09, 'rgba(43,45,91,.28)'); circle(b.x + b.w * 0.93, cy, q * 0.09, 'rgba(43,45,91,.28)');
        text(BAR_NAMES[b.i], cx, cy + 1, clamp(q * 0.4, 13, 28), '#fff');
      }
    }
    for (const p of this.pads) this.drawPad(p);
  }
};

/* ================= かず（1から じゅんばんに） ================= */
const NUM_READ = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう', 'じゅう'];
const NUM_ROUNDS = [3, 4, 5, 6, 8, 10];
const NumberGame = {
  bgColor: '#3FC4D0',
  items: [], fish: [], bub: [], layer: null, round: 0, n: 3, next: 1, idle: 0, doneT: -1, cheered: false,
  enter() {
    this.round = 0;
    this.bub = [];
    for (let i = 0; i < 12; i++) this.bub.push({ x: rand(W), y: rand(H), r: rand(3, 9), v: rand(18, 46), p: rand(TAU) });
    this.fish = [];
    this.setup();
  },
  exit() { this.items = []; this.fish = []; this.layer = freeLayer(this.layer); },
  resize() { this.layer = freeLayer(this.layer); this.place(); },
  setup() {
    this.n = NUM_ROUNDS[Math.min(this.round, NUM_ROUNDS.length - 1)];
    this.next = 1; this.idle = 0; this.doneT = -1;
    const cols = shuffle(RAINBOW.slice());
    this.items = [];
    for (let k = 1; k <= this.n; k++) this.items.push({ n: k, x: 0, y: 0, r: 40, color: cols[(k - 1) % cols.length], ph: rand(TAU), pop: -1, shake: 0, born: -k * 0.06 });
    this.place();
  },
  /* いちばん大きく並べられるマス目をさがして、ばらばらに置く */
  place() {
    const top = safe.t + 86, bottom = H - Math.max(safe.b, 8) - 14, left = safe.l + 12, right = W - safe.r - 12;
    const rw = Math.max(60, right - left), rh = Math.max(60, bottom - top);
    let best = null;
    for (let cols = 1; cols <= 6; cols++) {
      const rows = Math.ceil(this.n / cols), cell = Math.min(rw / cols, rh / rows);
      if (!best || cell > best.cell) best = { cols, rows, cell };
    }
    const cw = rw / best.cols, ch = rh / best.rows, r = clamp(Math.min(cw, ch) * 0.39, 24, 66);
    const idx = shuffle(Array.from({ length: best.cols * best.rows }, (_, i) => i));
    this.items.forEach((it, i) => {
      const c = idx[i], jx = Math.max(0, cw / 2 - r - 6), jy = Math.max(0, ch / 2 - r - 8);
      it.x = left + cw * (c % best.cols + 0.5) + rand(-jx, jx);
      it.y = top + ch * (Math.floor(c / best.cols) + 0.5) + rand(-jy, jy);
      it.r = r;
    });
  },
  update(dt) {
    this.idle += dt;
    for (const b of this.bub) { b.y -= b.v * dt; if (b.y < -12) { b.y = H + 12; b.x = rand(W); } }
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.born += dt;
      it.shake = Math.max(0, it.shake - dt * 2.4);
      if (it.pop >= 0) { it.pop += dt; if (it.pop > 0.28) this.items.splice(i, 1); }
    }
    for (let i = this.fish.length - 1; i >= 0; i--) { const f = this.fish[i]; f.x += f.v * dt; if (f.x > W + 90) this.fish.splice(i, 1); }
    if (this.doneT >= 0) {
      this.doneT += dt;
      if (!this.cheered && this.doneT > 0.6) {   // さいごの数を言いおわってから ほめる
        this.cheered = true;
        celebrate();
        const cols = shuffle(RAINBOW.slice());
        for (let i = 0; i < 7; i++) this.fish.push({ x: -60 - i * rand(50, 90), y: rand(safe.t + 120, Math.max(safe.t + 130, H - safe.b - 80)), v: rand(150, 230), s: rand(38, 58), color: cols[i % cols.length], p: rand(TAU) });
      }
      if (this.doneT > 3.5) { this.round++; this.setup(); }
    }
  },
  down(p) {
    let hit = null, best = 1e9;
    for (const it of this.items) {
      if (it.pop >= 0 || it.born < 0) continue;
      const d = Math.hypot(p.x - it.x, p.y - it.y);
      if (d < it.r + 14 && d < best) { best = d; hit = it; }
    }
    if (!hit) { tapSparkle(p.x, p.y); return; }
    if (hit.n === this.next) {
      hit.pop = 0;
      this.idle = 0;
      Sound.note(DOREMI[(hit.n - 1) % DOREMI.length], 0.42, 0.9);
      Sound.pop(1.2);
      burstConfetti(hit.x, hit.y, 12, 0.8, [hit.color, shade(hit.color, 0.4), '#FFFFFF']);
      ringFx(hit.x, hit.y, hit.r * 1.3, '#fff', 7, 0.36);
      Voice.say(String(hit.n));
      this.next++;
      if (this.next > this.n) { this.doneT = 0; this.cheered = false; }   // ぜんぶできた！
    } else {
      hit.shake = 1;
      this.idle = 9;   // すぐヒントを出す
      Sound.wobble();
    }
  },
  paintBg() {
    ctx.fillStyle = this.bgColor; ctx.fillRect(0, 0, W, H);
    /* うみの そう */
    [['#39BACA', 0.34], ['#31ABC0', 0.6], ['#2A9CB4', 0.84]].forEach((b, k) => {
      ctx.fillStyle = b[0];
      ctx.beginPath(); ctx.moveTo(0, H);
      const y0 = H * b[1];
      for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, y0 + Math.sin(x / 46 + k * 1.7) * 9);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    });
    /* すなと かいそう */
    const sh = Math.max(safe.b + 22, H * 0.06);
    for (let i = 0; i < 5; i++) {
      const x = W * (0.1 + i * 0.2) + rand(-14, 14), h = sh + rand(40, 96), wv = rand(8, 14);
      ctx.strokeStyle = i % 2 ? '#2FA86F' : '#3DBE7C'; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, H - sh * 0.4);
      for (let t = 0; t <= 1.001; t += 0.1) ctx.lineTo(x + Math.sin(t * 7 + i) * wv * t, H - sh * 0.4 - h * t);
      ctx.stroke();
    }
    ctx.fillStyle = '#FFE2A0';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, H - sh + Math.sin(x / 60) * 7);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  },
  draw() {
    if (!this.layer) this.layer = makeLayer(() => this.paintBg());
    ctx.drawImage(this.layer, 0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
    for (const b of this.bub) { ctx.beginPath(); ctx.arc(b.x + Math.sin(time * 1.4 + b.p) * 6, b.y, b.r, 0, TAU); ctx.stroke(); }
    for (const f of this.fish) drawFish(f.x, f.y + Math.sin(time * 4 + f.p) * 7, f.s, f.color, 1, time + f.p);
    let target = null;
    for (const it of this.items) {
      if (it.born < 0) continue;
      const appear = outBack(Math.min(1, it.born / 0.3));
      const y = it.y + Math.sin(time * 1.6 + it.ph) * 4;
      const x = it.x + (it.shake > 0 ? Math.sin(it.shake * 30) * 7 * it.shake : 0);
      if (it.pop >= 0) {
        ctx.globalAlpha = clamp(1 - it.pop / 0.28, 0, 1);
        drawNumBubble(x, y, it.r, it.color, it.n, 1 + it.pop * 2.2);
        ctx.globalAlpha = 1;
      } else {
        const isT = it.n === this.next;
        if (isT) target = { x, y, r: it.r };
        drawNumBubble(x, y, it.r, it.color, it.n, appear * (isT && this.idle > 3.5 ? 1 + 0.07 * Math.sin(time * 7) : 1));
      }
    }
    /* しばらく迷っていたら「これだよ」と教える */
    if (target && this.idle > 3.5) {
      const k = 0.5 + 0.5 * Math.sin(time * 7);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * k).toFixed(2) + ')'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(target.x, target.y, target.r + 9 + k * 5, 0, TAU); ctx.stroke();
      const ay = target.y - target.r - 20 - k * 8, s = 13;
      ctx.fillStyle = 'rgba(43,45,91,.25)';
      ctx.beginPath(); ctx.moveTo(target.x - s, ay - s + 3); ctx.lineTo(target.x + s, ay - s + 3); ctx.lineTo(target.x, ay + 3 + 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(target.x - s, ay - s); ctx.lineTo(target.x + s, ay - s); ctx.lineTo(target.x, ay + 3); ctx.closePath(); ctx.fill();
    }
    /* つぎの かず */
    if (this.doneT < 0) {
      const cy = safe.t + 30, h = 40, w = 124, nx = this.items.find(it => it.n === this.next);
      card(W / 2 - w / 2, cy - h / 2, w, h, h / 2, '#fff', 'rgba(43,45,91,.2)', 3);
      text('つぎは', W / 2 - 20, cy + 1, 16, INK);
      if (nx) drawNumBubble(W / 2 + 36, cy - 1, 15, nx.color, nx.n);
    }
  }
};

/* ================= くるま（かいり用） ================= */
const VEHICLES = [
  { id: 'car', name: 'くるま', say: '車で、出発！' },
  { id: 'police', name: 'パトカー', say: 'パトカー、出動！' },

  { id: 'bike', name: 'バイク', say: 'バイクで、出発！' }
];
const GLASS = '#BDE8FF', TIRE = '#2B2D3B', ROAD = '#5A5F7D';

/* 上から見た のりもの（上むき）。s = ながさ */
function drawVehicle(id, x, y, s, rot) {
  ctx.save();
  ctx.translate(x, y);

  const L = id === 'fire' ? s * 1.1 : s;

    const w = s * 0.3;
    fillRR(-w * 0.5 + 3, -L * 0.5 + 5, w, L, w * 0.5, 'rgba(20,22,50,.22)');
    fillRR(-w * 0.17, -L * 0.5, w * 0.34, L * 0.3, w * 0.17, TIRE);
    fillRR(-w * 0.19, L * 0.2, w * 0.38, L * 0.3, w * 0.19, TIRE);
    fillRR(-w * 0.34, -L * 0.3, w * 0.68, L * 0.62, w * 0.32, C.blue);

    ctx.strokeStyle = TIRE; ctx.lineWidth = w * 0.13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-w * 0.8, -L * 0.24); ctx.lineTo(w * 0.8, -L * 0.24); ctx.stroke();
    ctx.strokeStyle = C.orange; ctx.lineWidth = w * 0.2;
    ctx.beginPath(); ctx.moveTo(-w * 0.5, L * 0.0); ctx.lineTo(-w * 0.72, -L * 0.22); ctx.moveTo(w * 0.5, L * 0.0); ctx.lineTo(w * 0.72, -L * 0.22); ctx.stroke();
    oval(0, L * 0.04, w * 0.62, L * 0.11, C.orange);
    circle(0, -L * 0.02, w * 0.4, C.yellow);
    ctx.fillStyle = TIRE; ctx.beginPath(); ctx.arc(0, -L * 0.02, w * 0.4, PI * 1.15, PI * 1.85); ctx.lineTo(0, -L * 0.02); ctx.closePath(); ctx.fill();
    fillRR(-w * 0.06, L * 0.02, w * 0.12, L * 0.12, w * 0.06, '#FFFFFF');
    ctx.restore();
    return;
  }
  const w = s * 0.56;
  const main = id === 'police' ? '#FFFFFF' : C.red;
  fillRR(-w / 2 + 3, -L / 2 + 6, w, L, w * 0.32, 'rgba(20,22,50,.25)');
  for (const sy of id === 'fire' ? [-0.32, 0.12, 0.34] : [-0.3, 0.3]) for (const sx of [-1, 1]) fillRR(sx * w * 0.5 - w * 0.1, sy * L - L * 0.09, w * 0.2, L * 0.18, w * 0.07, TIRE);
  fillRR(-w / 2, -L / 2, w, L, w * 0.34, id === 'police' ? '#C9CDDB' : shade(C.red, -0.22));
  fillRR(-w / 2, -L / 2, w, L - 4, w * 0.34, main);
  if (id === 'police') {   // ボンネットとうしろは くろ
    ctx.save(); rr(-w / 2, -L / 2, w, L - 4, w * 0.34); ctx.clip();
    ctx.fillStyle = INK; ctx.fillRect(-w / 2, -L / 2, w, L * 0.28); ctx.fillRect(-w / 2, L * 0.3, w, L * 0.25);
    ctx.restore();
  }
  circle(-w * 0.3, -L * 0.44, w * 0.09, '#FFF3A8'); circle(w * 0.3, -L * 0.44, w * 0.09, '#FFF3A8');
  if (id === 'fire') {
    fillRR(-w * 0.4, -L * 0.36, w * 0.8, L * 0.13, w * 0.08, GLASS);
    const on = Math.floor(time * 6) % 2;
    fillRR(-w * 0.36, -L * 0.2, w * 0.72, L * 0.06, w * 0.03, on ? '#FFE14D' : '#C7342B');
    ctx.fillStyle = '#E3E6EF';
    ctx.fillRect(-w * 0.28, -L * 0.1, w * 0.08, L * 0.56); ctx.fillRect(w * 0.2, -L * 0.1, w * 0.08, L * 0.56);
    for (let yy = -L * 0.06; yy < L * 0.44; yy += L * 0.075) ctx.fillRect(-w * 0.24, yy, w * 0.48, L * 0.025);
    circle(0, L * 0.4, w * 0.12, '#E3E6EF');
  } else {
    if (id === 'car') { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-w * 0.13, -L * 0.48, w * 0.07, L * 0.25); ctx.fillRect(w * 0.06, -L * 0.48, w * 0.07, L * 0.25); }
    fillRR(-w * 0.38, -L * 0.21, w * 0.76, L * 0.16, w * 0.1, GLASS);
    fillRR(-w * 0.36, -L * 0.05, w * 0.72, L * 0.27, w * 0.12, id === 'police' ? '#FFFFFF' : shade(C.red, 0.12));
    fillRR(-w * 0.34, L * 0.22, w * 0.68, L * 0.1, w * 0.08, GLASS);
    if (id === 'police') {
      const on = Math.floor(time * 6) % 2;
      if (on) circle(-w * 0.18, L * 0.08, w * 0.42, 'rgba(255,70,70,.22)'); else circle(w * 0.18, L * 0.08, w * 0.42, 'rgba(70,140,255,.22)');
      fillRR(-w * 0.34, L * 0.04, w * 0.33, L * 0.08, w * 0.04, on ? '#FF3B3B' : '#8E2B2B');
      fillRR(w * 0.01, L * 0.04, w * 0.33, L * 0.08, w * 0.04, on ? '#2B5AA0' : '#3B8BFF');
    }
  }
  ctx.fillStyle = shade(C.red, -0.35);
  ctx.fillRect(-w * 0.4, L * 0.44, w * 0.18, L * 0.035); ctx.fillRect(w * 0.22, L * 0.44, w * 0.18, L * 0.035);
  ctx.restore();
}
function drawCone(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  fillRR(-s / 2 + 3, -s / 2 + 5, s, s, s * 0.2, 'rgba(20,22,50,.22)');
  fillRR(-s / 2, -s / 2, s, s, s * 0.2, '#E8701E');
  circle(0, 0, s * 0.38, C.orange);
  circle(0, 0, s * 0.26, '#FFFFFF');
  circle(0, 0, s * 0.16, C.orange);

}

const Drive = {
  bgColor: '#7CCB5E',
  st: 'pick', veh: null, cards: [], items: [], deco: [],
  enter() {
    this.st = 'pick'; this.items = []; this.drag = null;
    this.layout();
  },
  exit() { this.items = []; },
  resize() { this.layout(); },
  layout() {
    /* えらぶ画面：ちゅうしゃじょう */
    const land = W > H * 1.05, cols = land ? 4 : 2, rows = land ? 1 : 2;
    const top = safe.t + 70, bot = H - Math.max(safe.b, 8) - 12, left = safe.l + 14, right = W - safe.r - 14;
    this.lot = { x: left, y: top, w: right - left, h: bot - top };
    const cw = (right - left) / cols, ch = (bot - top) / rows;
    this.cards = VEHICLES.map((v, i) => ({ v, x: left + (i % cols) * cw, y: top + Math.floor(i / cols) * ch, w: cw, h: ch }));
    /* はしる画面 */
    const RW = Math.min((W - safe.l - safe.r) * 0.76, Math.max(250, H * 0.62), 460);
    this.roadL = W / 2 - RW / 2; this.RW = RW; this.laneW = RW / 3;
    this.s = Math.min(this.laneW * 1.25, H * 0.2);
    this.py = H - Math.max(safe.b, 8) - this.s * 0.7 - 14;
    if (this.px === undefined || this.st === 'pick') this.px = this.laneX(1);
    this.deco = [];
    const sideW = this.roadL;
    if (sideW > 26) {
      for (let y = -60, k = 0; y < H + 60; y += 74, k++) {
        for (const side of [0, 1]) {
          const tree = (k + side) % 3 !== 1;
          const r = tree ? Math.min(sideW * 0.36, 30) * rand(0.8, 1.05) : 4;
          const x = side ? rand(this.roadL + RW + r + 8, W - Math.min(r, 10)) : rand(Math.min(r, 10), this.roadL - r - 8);
          this.deco.push({ x, y: y + rand(-14, 14), r, tree, side });
        }
      }
    }
    this.decoSpan = Math.ceil((H + 120) / 74) * 74;
  },
  laneX(i) { return this.roadL + this.laneW * (i + 0.5); },
  start(v) {
    this.veh = v; this.st = 'drive';
    this.items = []; this.lane = 1; this.px = this.laneX(1); this.pvx = 0;
    this.score = 0; this.bump = 0; this.combo = 0; this.wob = 0; this.boost = 1;
    this.scroll = 0; this.nextRow = this.laneW * 2; this.goalWait = false; this.goalOn = false; this.idle = 0; this.puffT = 0;
    Sound.enter();
    if (v.id === 'police' || v.id === 'fire') Sound.siren(); else if (v.id === 'bike') Sound.vroom(); else Sound.horn();
    Voice.say(v.say);
  },
  setLane(x) {
    const i = clamp(Math.floor((x - this.roadL) / this.laneW), 0, 2);
    if (i !== this.lane) { this.lane = i; Sound.swish(); } else if (!this.dragging) Sound.tick();
  },
  honk() {
    const id = this.veh.id;
    if (id === 'police' || id === 'fire') Sound.siren(); else if (id === 'bike') Sound.vroom(); else Sound.horn();
    ringFx(this.px, this.py, this.s * 0.8, '#fff', 6, 0.4);
  },
  spawnRow() {
    const y = -60;
    if (this.goalWait) {
      this.goalWait = false; this.goalOn = true;
      this.items.push({ k: 'goal', y });
      this.nextRow = this.laneW * 2.6;
      return;
    }
    const a = (Math.random() * 3) | 0;
    let gap = this.laneW * rand(1.7, 2.3);
    if (Math.random() < 0.85) {
      const n = Math.random() < 0.25 ? 3 : 1;
      for (let k = 0; k < n; k++) this.items.push({ k: 'star', lane: a, y: y - k * this.laneW * 0.75, ph: rand(TAU) });
      if (n > 1) gap += this.laneW * 1.5;
    }
    if (!this.goalOn && this.score >= 3 && Math.random() < 0.35) {
      let b = (Math.random() * 3) | 0;
      if (b === a) b = (a + 1 + ((Math.random() * 2) | 0)) % 3;
      this.items.push({ k: 'cone', lane: b, y: y - this.laneW * 0.3 });
    }
    this.nextRow = gap;
  },
  update(dt) {
    if (this.st !== 'drive') return;
    this.idle += dt;
    this.bump = Math.max(0, this.bump - dt * 4);
    this.wob = Math.max(0, this.wob - dt * 1.6);
    this.boost = Math.min(1, this.boost + dt * 0.5);
    const v = H * lerp(0.32, 0.58, Math.min(1, this.score / 60)) * this.boost, dy = v * dt;
    this.scroll += dy;
    const ox = this.px;
    this.px += (this.laneX(this.lane) - this.px) * Math.min(1, dt * 10);
    this.pvx = dt > 0 ? (this.px - ox) / dt : 0;
    for (const d of this.deco) { d.y += dy; if (d.y > H + 60) d.y -= this.decoSpan; }
    this.puffT -= dt;
    if (this.puffT <= 0) {
      this.puffT = 0.09;
      addPart({ k: 'dot', x: this.px + rand(-4, 4), y: this.py + this.s * 0.55, vx: rand(-20, 20), vy: v * 0.6, life: 0.35, size: rand(3, 6), color: 'rgba(255,255,255,.7)', shrink: true });
    }
    this.nextRow -= dy;
    if (this.nextRow <= 0) this.spawnRow();
    const hitY = this.s * 0.45;
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      if (it.fly) {
        it.life -= dt; it.x += it.vx * dt; it.y += it.vy * dt; it.vy += 1100 * dt; it.rot += it.vr * dt;
        if (it.life <= 0) this.items.splice(i, 1);
        continue;
      }
      it.y += dy;
      if (it.k === 'goal') {
        if (!it.passed && it.y > this.py - this.s * 0.3) {
          it.passed = true; this.goalOn = false;
          celebrate(null, true);
          burstConfetti(this.px, this.py - this.s * 0.4, 30, 1.3);
        }
      } else {
        it.x = this.laneX(it.lane);
        if (Math.abs(it.x - this.px) < this.laneW * 0.5 && Math.abs(it.y - this.py) < hitY + this.laneW * 0.2) {
          if (it.k === 'star') {
            this.items.splice(i, 1);
            this.score++; this.bump = 1;
            Sound.note(DOREMI[this.combo % DOREMI.length], 0.36, 0.6);
            this.combo++;
            burstStars(it.x, it.y, 7, 0.9, [C.yellow, '#FFFFFF', C.orange]);
            if (this.score % 10 === 0) this.goalWait = true;
            continue;
          } else {   // コーンにあたっても ふっとぶだけ（へらない）
            it.fly = true; it.life = 0.9; it.rot = 0;
            it.vx = (it.x >= this.px ? 1 : -1) * rand(260, 420); it.vy = -rand(380, 520); it.vr = rand(-12, 12);
            this.wob = 1; this.boost = 0.55; this.combo = 0;
            Sound.boing(); Sound.wobble();
            continue;
          }
        }
      }
      if (it.y > H + 80) this.items.splice(i, 1);
    }
  },
  down(p) {
    if (this.st === 'pick') {
      for (const c of this.cards) {
        if (p.x >= c.x && p.x < c.x + c.w && p.y >= c.y && p.y < c.y + c.h) {
          burstStars(c.x + c.w / 2, c.y + c.h / 2, 10, 1.2);
          this.start(c.v);
          return;
        }
      }
      tapSparkle(p.x, p.y);
      return;
    }
    this.idle = 0;
    if (Math.abs(p.x - this.px) < this.s * 0.4 && Math.abs(p.y - this.py) < this.s * 0.6) { this.honk(); return; }
    this.drag = p.id;
    this.dragging = false;
    this.setLane(p.x);
    this.dragging = true;
  },
  move(p) { if (this.st === 'drive' && p.id === this.drag) this.setLane(p.x); },
  up(p) { if (p.id === this.drag) { this.drag = null; this.dragging = false; } },
  drawPick() {

    const bh = 30, off = this.scroll % (bh * 2);

        star(it.x, it.y, r, C.yellow, a);
        circle(it.x - r * 0.2, it.y - r * 0.2, r * 0.14, 'rgba(255,255,255,.8)');

        ctx.globalAlpha = 1;

    drawVehicle(this.veh.id, this.px, this.py, this.s, tilt);
    /* はじめと、しばらくさわっていない時は ← → を出す */

        ctx.beginPath(); ctx.moveTo(x + sgn * 16, y); ctx.lineTo(x, y - 14); ctx.lineTo(x, y + 14); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    drawCounter(this.score, this.bump, (x, y) => star(x, y, 10, C.yellow));
  }
};

  big: { key: 'big', newN: 3, qN: 6, choices: 3, tol: 0.075, tolS: 0.13, tolE: 0.15, cov: 0.8, color: C.blue },

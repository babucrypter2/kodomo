function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const HiraSave = {
  get(k) { const v = store.get('hira-' + k, null); return v && typeof v === 'object' ? v : { n: 0, days: [], last: '', added: 0 }; },
  set(k, v) { store.set('hira-' + k, v); },
  cleared(k) { return this.get(k).last === todayStr(); },
  finish(k, newN) {
    const v = this.get(k), t = todayStr();
    if (v.last === t) return v;
    const add = Math.max(0, Math.min(newN, KANA.length - v.n));
    v.n += add; v.added = add; v.last = t; v.days.push(t);
    if (v.days.length > 400) v.days = v.days.slice(-400);
    this.set(k, v);
    return v;
  },
  undoToday(k) {
    const v = this.get(k);
    if (v.last !== todayStr()) return;
    v.n = Math.max(0, v.n - (v.added || 0)); v.added = 0; v.last = '';
    if (v.days[v.days.length - 1] === todayStr()) v.days.pop();
    this.set(k, v);
  },
  reset(k) { this.set(k, { n: 0, days: [], last: '', added: 0 }); }
};

/* ---- 書き順（KanjiVG のデータ）---- */
const strokeCache = new Map();
function kanaStrokes(ch) {
  let st = strokeCache.get(ch);
  if (!st) { st = (STROKES[ch] || []).map(str => str.split(' ').map(q => { const a = q.split(','); return [a[0] / 1000, a[1] / 1000]; })); strokeCache.set(ch, st); }
  return st;
}
const pd = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function polyLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += pd(p[i], p[i - 1]); return L; }
function distToPoly(q, poly) {
  if (poly.length === 1) return pd(q, poly[0]);
  let m = 1e9;
  for (let i = 1; i < poly.length; i++) {
    const a = poly[i - 1], b = poly[i], dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
    const t = L2 ? clamp(((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / L2, 0, 1) : 0;
    const d = Math.hypot(q[0] - a[0] - dx * t, q[1] - a[1] - dy * t);
    if (d < m) m = d;
  }
  return m;
}
function pointAt(pts, frac) {
  const L = polyLen(pts) * clamp(frac, 0, 1);
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const seg = pd(pts[i], pts[i - 1]);
    if (acc + seg >= L) { const k = seg ? (L - acc) / seg : 0; return { p: [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)], i }; }
    acc += seg;
  }
  return { p: pts[pts.length - 1], i: pts.length - 1 };
}
function strokeLine(pts, ox, oy, B, frac) {
  ctx.beginPath();
  ctx.moveTo(ox + pts[0][0] * B, oy + pts[0][1] * B);
  if (frac === undefined || frac >= 1) { for (let i = 1; i < pts.length; i++) ctx.lineTo(ox + pts[i][0] * B, oy + pts[i][1] * B); }
  else {
    const h = pointAt(pts, frac);
    for (let i = 1; i < h.i; i++) ctx.lineTo(ox + pts[i][0] * B, oy + pts[i][1] * B);
    ctx.lineTo(ox + h.p[0] * B, oy + h.p[1] * B);
  }
  if (pts.length === 1) ctx.lineTo(ox + pts[0][0] * B + 0.1, oy + pts[0][1] * B);
  ctx.stroke();
}
function strokeBadge(n, x, y, r, col) {
  circle(x, y + 1.5, r, 'rgba(43,45,91,.25)');
  circle(x, y, r, col);
  text(String(n), x, y + 1, r * 1.25, '#fff', { fam: F_NUM, weight: 'normal' });
}
/* 字の 書き順アニメーション（1画ずつ かいていく） */
function drawStrokeAnim(ch, ox, oy, B, t, col) {
  const sk = kanaStrokes(ch), n = sk.length, per = 0.8, total = n * per + 1.4, tt = t % total;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = B * 0.085;
  ctx.strokeStyle = shade(col, 0.78);
  for (const st of sk) strokeLine(st, ox, oy, B);
  ctx.strokeStyle = col;
  for (let i = 0; i < n; i++) {
    const f = clamp((tt - i * per) / (per - 0.15), 0, 1);
    if (f > 0) strokeLine(sk[i], ox, oy, B, f);
  }
  for (let i = 0; i < n; i++) {
    if (tt < i * per) break;
    const p = sk[i][0];
    strokeBadge(i + 1, ox + p[0] * B - B * 0.05, oy + p[1] * B - B * 0.05, B * 0.045, C.red);
  }
}

const Hira = {
  bgColor: '#D6F0FF',
  st: 'who', kid: null, steps: [], si: 0, t: 0,
  enter() { this.st = 'who'; this.kid = null; this.layout(); },
  exit() { this.ink = null; },
  resize() { this.layout(); },
  layout() {
    const land = W > H * 1.05;
    this.land = land;
    this.top = safe.t + 64; this.bot = H - Math.max(safe.b, 8) - 10;
    const l = safe.l + 16, r = W - safe.r - 16;
    const cw = land ? (r - l - 16) / 2 : r - l, ch = land ? this.bot - this.top - 50 : (this.bot - this.top - 66) / 2;
    this.whoCards = ['big', 'small'].map((k, i) => ({ k, x: land ? l + i * (cw + 16) : l, y: land ? this.top + 44 : this.top + 44 + i * (ch + 16), w: cw, h: ch }));
    this.box = Math.min(W - 48 - safe.l - safe.r, (this.bot - this.top) * (land ? 0.82 : 0.56), 420);
    this.boxX = W / 2 - this.box / 2;
    this.boxY = land ? this.top + (this.bot - this.top - this.box) / 2 : this.top + 40;
    if (land) this.boxX = W * 0.42 - this.box / 2;
    this.nextB = { x: land ? W * 0.82 : W / 2, y: land ? H / 2 + 40 : this.bot - 46, r: 40 };
    this.eraseB = { x: land ? W * 0.82 : W / 2 - 110, y: land ? H / 2 - 60 : this.bot - 46, r: 30 };
  },
  prof() { return HIRA_KIDS[this.kid]; },
  name() { return this.kid === 'big' ? KIDS.big : KIDS.small; },
  /* きょうのメニューをつくる */
  begin(k) {
    this.kid = k;
    const P = this.prof(), v = HiraSave.get(k);
    if (HiraSave.cleared(k)) { this.showReward(false); return; }
    let today;
    if (v.n >= KANA.length) today = shuffle(KANA.slice()).slice(0, P.newN);
    else today = KANA.slice(v.n, v.n + P.newN);
    const learned = KANA.slice(0, Math.max(v.n, 0)).concat(today);
    const pool = learned.length >= P.choices ? learned : KANA.slice(0, Math.max(P.choices + 1, v.n + P.newN));
    const steps = [];
    for (const it of today) { steps.push({ t: 'learn', it }); steps.push({ t: 'trace', it }); }
    const targets = today.slice();
    const recent = learned.slice(-12);
    while (targets.length < P.qN) targets.push(pick(recent));
    shuffle(targets);
    for (let i = 1; i < targets.length; i++) if (targets[i] === targets[i - 1]) { const j = (i + 1) % targets.length; const tmp = targets[i]; targets[i] = targets[j]; targets[j] = tmp; }
    for (const it of targets) {
      const others = shuffle(pool.filter(o => o !== it)).slice(0, P.choices - 1);
      steps.push({ t: 'quiz', it, ch: shuffle([it].concat(others)) });
    }
    this.steps = steps; this.si = -1;
    this.next();
  },
  next() {
    this.si++;
    if (this.si >= this.steps.length) { this.finish(); return; }
    const s = this.steps[this.si];
    this.st = s.t; this.t = 0; this.done = false; this.cur = s; this.wrong = new Set(); this.shake = null; this.hit = null;
    if (s.t === 'learn') this.speakLearn();
    else if (s.t === 'trace') { this.startTrace(); Voice.say('書いてみよう！ 赤い数字の、1番から、順番になぞってね。'); }
    else this.ask();
  },
  speakLearn() { const it = this.cur.it; Voice.say(it.k + '。' + it.sp + 'の、' + it.k + '。'); },
  ask() { Voice.say('どれが、' + this.cur.it.k + '、かな？'); },
  finish() {
    HiraSave.finish(this.kid, this.prof().newN);
    this.showReward(true);
  },
  showReward(fresh) {
    this.st = 'reward'; this.t = 0; this.fresh = fresh;
    const nm = this.name();
    if (fresh) {
      banner = { text: nm + ' クリア！', t: 0, dur: 2.6 };
      rainConfetti(90);
      Sound.fanfare();
      if (!Rec.playAny('clear-' + this.kid + '-', 1)) Voice.say(nm + '、すごい！ 今日のひらがな、クリア！ お菓子、もらってね！');
    } else {
      Voice.say('今日はもう、クリアしたよ。また明日ね！');
    }
  },
  /* ---- なぞる ---- */
  startTrace() {
    this.sk = kanaStrokes(this.cur.it.k);
    this.cs = 0; this.ink = null; this.drawId = null; this.fails = 0; this.rej = []; this.passed = false; this.guideT = 0; this.pt = 0;
  },
  judgeStroke() {
    const T = this.sk[this.cs], U = this.ink;
    this.ink = null; this.drawId = null;
    if (!U || !T) return;
    const P = this.prof(), relax = 1 + Math.min(0.8, this.fails * 0.2);
    const tol = P.tol * relax, tolS = P.tolS * relax, tolE = P.tolE * relax;
    const uL = polyLen(U), tL = polyLen(T);
    if (uL < Math.min(0.035, tL * 0.35)) { Sound.nope(); this.guideT = 0; return; }   // ちょんと さわっただけ
    const s0 = pd(U[0], T[0]), e0 = pd(U[U.length - 1], T[T.length - 1]);
    let cov = 0; for (const q of T) if (distToPoly(q, U) < tol) cov++;
    cov /= T.length;
    let prec = 0; for (const q of U) if (distToPoly(q, T) < tol * 1.6) prec++;
    prec /= U.length;
    /* 書くむきも チェック（みじかい線でも はんたいは ×） */
    const tv = [T[T.length - 1][0] - T[0][0], T[T.length - 1][1] - T[0][1]], uv = [U[U.length - 1][0] - U[0][0], U[U.length - 1][1] - U[0][1]];
    const tn = Math.hypot(tv[0], tv[1]), un = Math.hypot(uv[0], uv[1]);
    const dirOk = tn < 0.03 || un < 0.01 ? true : (tv[0] * uv[0] + tv[1] * uv[1]) / (tn * un) > 0.35;
    const nearStart = pd(U[0], T[0]) <= pd(U[0], T[T.length - 1]) + 0.01;
    const ok = dirOk && nearStart && s0 < tolS && e0 < tolE && cov >= P.cov * (1 - (relax - 1) * 0.3) && prec >= 0.62;
    if (ok) {
      this.cs++; this.fails = 0; this.guideT = 0;
      Sound.stroke(this.cs);
      const e = T[T.length - 1];
      burstStars(this.boxX + e[0] * this.box, this.boxY + e[1] * this.box, 8, 0.8);
      if (this.cs >= this.sk.length) {
        this.passed = true; this.t = 0;
        Sound.fanfare();
        burstStars(this.boxX + this.box / 2, this.boxY + this.box / 2, 18, 1.4);
        Voice.say(pick(['上手！', '上手に書けたね！', 'すごい！ きれいに書けたね！']));
      }
    } else {
      this.fails++; this.guideT = 0;
      this.rej.push({ pts: U, t: 0 });
      Sound.nope();
      const rev = !dirOk || (pd(U[0], T[T.length - 1]) < tolS && pd(U[U.length - 1], T[0]) < tolE && !nearStart);
      if (rev) Voice.say('反対だよ。赤い数字のところから書いてね。');
      else if (this.fails === 1 || this.fails % 3 === 0) Voice.say('光っている線を、数字のところから、なぞってね。');
    }
  },
  toBox(p) { return [(p.x - this.boxX) / this.box, (p.y - this.boxY) / this.box]; },
  /* ---- 入力 ---- */
  down(p) {
    if (this.st === 'who') {
      for (const c of this.whoCards) if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) { Sound.enter(); this.begin(c.k); return; }
      tapSparkle(p.x, p.y); return;
    }
    if (this.st === 'reward') { tapSparkle(p.x, p.y); Sound.chime(); return; }
    const nb = this.nextB, showNext = this.nextVisible();
    if (showNext && Math.hypot(p.x - nb.x, p.y - nb.y) < nb.r + 12) { Sound.pop(1.1); this.next(); return; }
    if (this.st === 'learn') {
      if (p.y < this.bot - 100 || this.land) { this.speakLearn(); Sound.chime(); burstStars(p.x, p.y, 6, 0.7); return; }
      tapSparkle(p.x, p.y); return;
    }
    if (this.st === 'trace') {
      const eb = this.eraseB;
      if (!this.passed && Math.hypot(p.x - eb.x, p.y - eb.y) < eb.r + 10) { this.startTrace(); Sound.whoosh(); return; }
      if (this.passed) { tapSparkle(p.x, p.y); return; }
      const q = this.toBox(p);
      if (q[0] < -0.08 || q[0] > 1.08 || q[1] < -0.08 || q[1] > 1.08) { tapSparkle(p.x, p.y); return; }
      if (this.drawId !== null) return;   // 2本目の ゆびは つかわない
      this.drawId = p.id; this.ink = [q];
      Sound.tick();
      return;
    }
    if (this.st === 'quiz') {
      if (this.done) return;
      const it = this.cur.it;
      const cards = this.quizCards();
      for (let i = 0; i < cards.length; i++) {
        const c = cards[i];
        if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) {
          if (c.it === it) {
            this.done = true; this.hit = i; this.t = 0;
            Sound.note(1046.5, 0.3, 0.5); Sound.sparkle();
            burstConfetti(c.x + c.w / 2, c.y + c.h / 2, 18, 1);
            Voice.say(pick(['正解！', '当たり！', 'ピンポーン！']));
          } else {
            this.shake = { i, t: 0 }; this.wrong.add(i);
            Sound.wobble();
            Voice.say('ちがうよ。どれが、' + it.k + '、かな？');
          }
          return;
        }
      }
      const sp = this.speaker();
      if (Math.hypot(p.x - sp.x, p.y - sp.y) < sp.r + 14) { this.ask(); ringFx(sp.x, sp.y, sp.r * 1.4, '#fff', 5, 0.4); return; }
      tapSparkle(p.x, p.y);
    }
  },
  move(p) {
    if (this.st !== 'trace' || this.passed || p.id !== this.drawId || !this.ink) return;
    const q = this.toBox(p), l = this.ink[this.ink.length - 1];
    if (pd(q, l) > 0.006) this.ink.push(q);
    if (time - this.pt > 0.07) { this.pt = time; Sound.pencil(); }
  },
  up(p) { if (this.st === 'trace' && p.id === this.drawId) this.judgeStroke(); },
  nextVisible() {
    if (this.st === 'learn') return this.t > 1.2;
    if (this.st === 'trace') return this.passed ? this.t > 0.6 : this.t > 45;   // どうしても むずかしい時は 45びょうで先へ
    return false;
  },
  update(dt) {
    this.t += dt;
    if (this.st === 'trace') { this.guideT += dt; for (let i = this.rej.length - 1; i >= 0; i--) { this.rej[i].t += dt; if (this.rej[i].t > 0.5) this.rej.splice(i, 1); } }
    if (this.shake) { this.shake.t += dt; if (this.shake.t > 0.5) this.shake = null; }
    if (this.st === 'quiz' && this.done && this.t > 1.1) this.next();
    if (this.st === 'trace' && this.passed && this.t > 2.2) this.next();
  },
  quizCards() {
    const n = this.cur.ch.length, gap = 14, land = this.land;
    const availW = W - safe.l - safe.r - 32, availH = this.bot - this.top - (land ? 20 : 150);
    const sz = Math.min((availW - gap * (n - 1)) / n, land ? (this.bot - this.top - 100) : availH, 170);
    const total = n * sz + (n - 1) * gap, x0 = W / 2 - total / 2;
    const y = land ? this.bot - sz - 8 : this.top + 150 + (availH - sz) / 2;
    return this.cur.ch.map((it, i) => ({ it, x: x0 + i * (sz + gap), y, w: sz, h: sz }));
  },
  speaker() { return this.land ? { x: W / 2, y: this.top + 46, r: 34 } : { x: W / 2, y: this.top + 70, r: 44 }; },
  /* ---- えがく ---- */
  drawProgress() {
    if (this.st === 'who' || this.st === 'reward') return;
    const n = this.steps.length, gap = 4, d = Math.min(14, (W - 140) / n - gap), tot = n * d + (n - 1) * gap, y = safe.t + 30;
    for (let i = 0; i < n; i++) {
      const x = W / 2 - tot / 2 + d / 2 + i * (d + gap);
      if (i < this.si) star(x, y, d * 0.62, C.yellow);
      else circle(x, y, d / 2, i === this.si ? '#FFFFFF' : 'rgba(43,45,91,.18)');
    }
  },
  drawNext() {
    if (!this.nextVisible()) return;
    const b = this.nextB, s = 1 + 0.06 * Math.sin(time * 6);
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(s, s);
    circle(0, 5, b.r, shade(C.green, -0.25)); circle(0, 0, b.r, C.green);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-b.r * 0.28, -b.r * 0.42); ctx.lineTo(b.r * 0.42, 0); ctx.lineTo(-b.r * 0.28, b.r * 0.42); ctx.closePath(); ctx.fill();
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.lineWidth = b.r * 0.12; ctx.stroke();
    ctx.restore();
  },
  drawKanaCard(x, y, w, h, ch, col, o) {
    o = o || NO;
    card(x, y, w, h, Math.min(w, h) * 0.16, o.bg || '#FFFFFF', 'rgba(43,45,91,.18)', 6);
    text(ch, x + w / 2, y + h / 2 + h * 0.02, Math.min(w, h) * 0.72, col, { weight: 'normal' });
  },
  drawWho() {
    nameTag('だれが やる？', W / 2, safe.t + 32, 36);
    for (const c of this.whoCards) {
      const P = HIRA_KIDS[c.k], v = HiraSave.get(c.k), ok = v.last === todayStr();
      card(c.x, c.y, c.w, c.h, 26, P.color, shade(P.color, -0.25), 7);
      const s = Math.min(c.h * 0.5, c.w * 0.32);
      const ix = c.x + c.w * 0.28, iy = c.y + c.h * 0.45;
      if (c.k === 'big') drawVehicle('car', ix, iy, s * 1.1, PI / 2);
      else drawAnimal('rabbit', ix, iy + s * 0.1, s * 0.8);
      const nx = c.x + c.w * 0.66;
      text(c.k === 'big' ? KIDS.big : KIDS.small, nx, c.y + c.h * 0.36, Math.min(c.h * 0.17, c.w * 0.1), '#fff');
      if (ok) nameTag('きょうは クリア！', nx, c.y + c.h * 0.62, Math.min(30, c.h * 0.16));
      else nameTag(Math.min(v.n, KANA.length) + ' / ' + KANA.length + ' もじ', nx, c.y + c.h * 0.62, Math.min(30, c.h * 0.16));
      if (ok) { star(c.x + c.w - 30, c.y + 30, 18, C.yellow, 0.2); }
    }
  },
  drawLearn() {
    const it = this.cur.it, col = this.prof().color, land = this.land;
    const pop = outBack(Math.min(1, this.t / 0.35));
    const cw = land ? Math.min(W * 0.36, this.bot - this.top - 20) : Math.min(W - 80, (this.bot - this.top) * 0.42);
    const cx = land ? W * 0.3 : W / 2, cy = land ? (this.top + this.bot) / 2 : this.top + 24 + cw / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(pop, pop);
    card(-cw / 2, -cw / 2, cw, cw, cw * 0.16, '#FFFFFF', 'rgba(43,45,91,.18)', 6);
    drawStrokeAnim(it.k, -cw / 2, -cw / 2, cw, Math.max(0, this.t - 0.3), col);
    ctx.restore();
    const ex = land ? W * 0.64 : W / 2, ey = land ? cy - 40 : cy + cw / 2 + (this.bot - 100 - cy - cw / 2) * 0.42;
    const es = land ? Math.min(110, H * 0.26) : Math.min(110, (this.bot - cy - cw / 2) * 0.38);
    text(it.e, ex, ey + Math.sin(time * 2.5) * 3, es, INK, { weight: 'normal' });
    /* ことば：その字だけ色をかえる */
    const chars = Array.from(it.w), fs = Math.min(44, (land ? W * 0.3 : W - 60) / chars.length);
    let tw = 0; const ws = chars.map(c => { const v = textW(c, fs); tw += v; return v; });
    let x = ex - tw / 2; const wy = ey + es * 0.8 + 10;
    chars.forEach((c, i) => { text(c, x + ws[i] / 2, wy, fs, i === it.at ? col : INK, { align: 'center' }); x += ws[i]; });
    this.drawNext();
  },
  drawTrace() {
    const B = this.box, x = this.boxX, y = this.boxY, col = this.prof().color, sk = this.sk;
    card(x, y, B, B, 20, '#FFFFFF', 'rgba(43,45,91,.18)', 6);
    ctx.save();
    ctx.setLineDash([8, 8]); ctx.strokeStyle = 'rgba(255,90,78,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + B / 2, y + 12); ctx.lineTo(x + B / 2, y + B - 12); ctx.moveTo(x + 12, y + B / 2); ctx.lineTo(x + B - 12, y + B / 2); ctx.stroke();
    ctx.restore();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = B * 0.09;
    sk.forEach((st, i) => {
      ctx.strokeStyle = i < this.cs ? col : '#E2E6F0';
      strokeLine(st, x, y, B);
    });
    if (!this.passed && sk[this.cs]) {
      const st = sk[this.cs], pulse = 0.5 + 0.5 * Math.sin(time * 6);
      ctx.strokeStyle = 'rgba(255,203,61,' + (0.55 + 0.35 * pulse).toFixed(2) + ')';
      ctx.lineWidth = B * 0.1;
      strokeLine(st, x, y, B);
      /* うごく ガイドの まる（書く むき） */
      const g = (this.guideT % 1.6) / 1.2;
      if (g <= 1) {
        const h = pointAt(st, g);
        ctx.globalAlpha = 0.9;
        circle(x + h.p[0] * B, y + h.p[1] * B, B * 0.045, C.orange);
        circle(x + h.p[0] * B, y + h.p[1] * B, B * 0.02, '#FFFFFF');
        ctx.globalAlpha = 1;
      }
      /* おわりに やじるし */
      const e = st[st.length - 1], e2 = st[Math.max(0, st.length - 3)], a = Math.atan2(e[1] - e2[1], e[0] - e2[0]);
      ctx.save(); ctx.translate(x + e[0] * B, y + e[1] * B); ctx.rotate(a);
      ctx.fillStyle = C.orange; ctx.beginPath(); ctx.moveTo(B * 0.06, 0); ctx.lineTo(-B * 0.02, -B * 0.045); ctx.lineTo(-B * 0.02, B * 0.045); ctx.closePath(); ctx.fill();
      ctx.restore();
      const s0 = st[0];
      strokeBadge(this.cs + 1, x + s0[0] * B - B * 0.05, y + s0[1] * B - B * 0.05, B * 0.05 * (1 + 0.12 * pulse), C.red);
    }
    ctx.save();
    rr(x - 20, y - 20, B + 40, B + 40, 26); ctx.clip();
    ctx.lineWidth = B * 0.06; ctx.strokeStyle = 'rgba(43,45,91,.8)';
    if (this.ink) strokeLine(this.ink, x, y, B);
    for (const r of this.rej) { ctx.globalAlpha = 1 - r.t / 0.5; ctx.strokeStyle = C.red; strokeLine(r.pts, x, y, B); }
    ctx.globalAlpha = 1;
    ctx.restore();
    /* なんかく目か */
    const n = sk.length, d = 16, gap = 10, tot = n * d + (n - 1) * gap, my = y + B + 26, mx = (this.land ? x + B / 2 : W / 2) - tot / 2 + d / 2;
    for (let i = 0; i < n; i++) {
      if (i < this.cs) star(mx + i * (d + gap), my, d * 0.62, C.yellow);
      else circle(mx + i * (d + gap), my, d / 2, i === this.cs ? '#FFFFFF' : 'rgba(43,45,91,.18)');
    }
    if (!this.passed) {
      const eb = this.eraseB;   // さいしょから
      circle(eb.x, eb.y + 4, eb.r, 'rgba(43,45,91,.2)'); circle(eb.x, eb.y, eb.r, '#FFFFFF');
      ctx.save(); ctx.translate(eb.x, eb.y); ctx.rotate(-0.5);
      fillRR(-eb.r * 0.55, -eb.r * 0.28, eb.r * 1.1, eb.r * 0.56, 5, C.pink);
      fillRR(-eb.r * 0.55, -eb.r * 0.28, eb.r * 0.42, eb.r * 0.56, 5, C.sky);
      ctx.restore();
    }
    this.drawNext();
  },
  drawQuiz() {
    const sp = this.speaker();
    const s = 1 + (this.t < 1.2 ? 0.08 * Math.sin(time * 10) : 0);
    ctx.save(); ctx.translate(sp.x, sp.y); ctx.scale(s, s);
    circle(0, 5, sp.r, shade(C.orange, -0.25)); circle(0, 0, sp.r, C.orange);
    ctx.fillStyle = '#fff';   // スピーカー
    const r = sp.r;
    ctx.beginPath(); ctx.moveTo(-r * 0.45, -r * 0.18); ctx.lineTo(-r * 0.22, -r * 0.18); ctx.lineTo(r * 0.06, -r * 0.42); ctx.lineTo(r * 0.06, r * 0.42); ctx.lineTo(-r * 0.22, r * 0.18); ctx.lineTo(-r * 0.45, r * 0.18); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.09; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(r * 0.1, 0, r * 0.28, -0.8, 0.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 0.1, 0, r * 0.48, -0.8, 0.8); ctx.stroke();
    ctx.restore();
    if (!this.land) nameTag('どれかな？', W / 2, sp.y + sp.r + 30, 34);
    const cards = this.quizCards(), col = this.prof().color;
    cards.forEach((c, i) => {
      let dx = 0, sc = 1;
      if (this.shake && this.shake.i === i) dx = Math.sin(this.shake.t * 40) * 8 * (1 - this.shake.t / 0.5);
      if (this.hit === i) sc = 1 + 0.12 * outBack(Math.min(1, this.t / 0.3));
      const dim = this.wrong.has(i) && this.hit !== i;
      ctx.save();
      ctx.translate(c.x + c.w / 2 + dx, c.y + c.h / 2); ctx.scale(sc, sc);
      ctx.globalAlpha = dim ? 0.45 : 1;
      this.drawKanaCard(-c.w / 2, -c.h / 2, c.w, c.h, c.it.k, this.hit === i ? '#fff' : INK, { bg: this.hit === i ? col : '#FFFFFF' });
      ctx.restore();
    });
  },
  drawReward() {
    const v = HiraSave.get(this.kid), land = this.land, col = this.prof().color;
    const k = outBack(Math.min(1, this.t / 0.5));
    /* おかし（つつみのキャンディ） */
    const cx = land ? W * 0.28 : W / 2, cy = land ? H * 0.5 : this.top + (this.bot - this.top) * 0.3, s = Math.min(land ? H * 0.3 : W * 0.24, 110) * k;
    ctx.save(); ctx.translate(cx, cy + Math.sin(time * 3) * 4); ctx.rotate(Math.sin(time * 2) * 0.08);
    for (const sg of [-1, 1]) {
      ctx.fillStyle = shade(C.pink, -0.1);
      ctx.beginPath(); ctx.moveTo(sg * s * 0.6, 0); ctx.lineTo(sg * s * 1.25, -s * 0.5); ctx.lineTo(sg * s * 1.15, 0); ctx.lineTo(sg * s * 1.25, s * 0.5); ctx.closePath(); ctx.fill();
    }
    circle(0, 0, s * 0.68, C.pink);
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, s * 0.68, 0, TAU); ctx.clip();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = s * 0.14;
    for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * s * 0.32 - s, -s); ctx.lineTo(i * s * 0.32 + s, s); ctx.stroke(); }
    ctx.restore();
    oval(-s * 0.25, -s * 0.3, s * 0.14, s * 0.08, 'rgba(255,255,255,.7)', -0.6);
    ctx.restore();
    for (let i = 0; i < 6; i++) { const a = time * 0.8 + i * TAU / 6; star(cx + Math.cos(a) * s * 1.6, cy + Math.sin(a) * s * 1.0, 8, RAINBOW[i], a); }
    const tx = land ? W * 0.68 : W / 2;
    let ty = land ? this.top + 30 : cy + s * 1.35 + 20;
    const msg = this.fresh ? 'おかし ゲット！' : 'きょうは クリアずみ';
    nameTag(msg, tx, ty, 40);
    ty += 50;
    text(this.fresh ? 'おうちの ひとに みせてね' : 'また あした ね', tx, ty, 17, INK);
    ty += 34;
    /* スタンプカード */
    const days = v.days.length, cols = 7, cell = Math.min(40, ((land ? W * 0.5 : W - 60)) / cols - 6);
    const show = Math.max(14, Math.ceil((days + 1) / 7) * 7), rows = Math.min(5, Math.ceil(show / 7));
    const start = Math.max(0, days - rows * 7 + (days % 7 === 0 && days ? 0 : 0));
    const gx = tx - (cols * (cell + 6) - 6) / 2;
    for (let i = 0; i < rows * 7; i++) {
      const d = start + i, x = gx + (i % 7) * (cell + 6) + cell / 2, y = ty + Math.floor(i / 7) * (cell + 6) + cell / 2;
      circle(x, y, cell / 2, 'rgba(255,255,255,.75)');
      if (d < days) {
        const isNew = this.fresh && d === days - 1, sc = isNew ? outBack(clamp((this.t - 0.6) / 0.4, 0, 1)) : 1;
        if (sc > 0) { star(x, y, cell * 0.4 * sc, RAINBOW[d % 8], 0.2); }
      } else text(String(d + 1), x, y + 1, cell * 0.36, 'rgba(43,45,91,.35)', { fam: F_NUM, weight: 'normal' });
    }
    ty += rows * (cell + 6) + 12;
    text(this.name() + '：' + Math.min(v.n, KANA.length) + ' / ' + KANA.length + ' もじ', tx, ty, 15, INK);
    const d = new Date();
    text((d.getMonth() + 1) + '/' + d.getDate() + ' クリア', tx, ty + 24, 13, 'rgba(43,45,91,.6)');
    void col;
  },
  draw() {
    ctx.fillStyle = this.bgColor; ctx.fillRect(0, 0, W, H);
    for (let y = 30, row = 0; y < H + 40; y += 84, row++) for (let x = (row % 2 ? 62 : 20); x < W + 40; x += 84) circle(x, y, 13, '#C4E8FF');
    if (this.st === 'who') this.drawWho();
    else if (this.st === 'learn') this.drawLearn();
    else if (this.st === 'trace') this.drawTrace();
    else if (this.st === 'quiz') this.drawQuiz();
    else this.drawReward();
    this.drawProgress();
  }
};

/* ================= おとなの せってい（HTMLの画面） ================= */
const Settings = (() => {
  let el = null, isOpen = false;
  const REC_ROWS = [
    { title: KIDS.small + ' を ほめる声', hint: '例：「' + KIDS.small + '、すごーい！」「じょうずだね！」', prefix: 'praise-small-', n: 3 },
    { title: KIDS.big + ' を ほめる声', hint: '例：「' + KIDS.big + '、すごい！」「かっこいい！」', prefix: 'praise-big-', n: 3 },
    { title: 'ひらがなクリアの声（' + KIDS.small + '）', hint: '例：「クリア！おかし もらってね！」', prefix: 'clear-small-', n: 1 },

      '<div class="grp photo"><img src="' + esc(MAMA.src) + '" alt=""><div class="rrow"><label class="btn">写真を かえる<input type="file" accept="image/*" data-a="photo" hidden></label>' +

    for (const row of REC_ROWS) {
      h += '<div class="grp"><div class="gt">' + esc(row.title) + '</div><div class="hint">' + esc(row.hint) + '</div>';
      for (let i = 0; i < row.n; i++) {
        const key = row.prefix + i, has = Rec.has(key), recNow = Rec.recording && recKey === key;
        h += '<div class="rrow"><span class="no">' + (i + 1) + '</span>' +
          '<button class="rec' + (recNow ? ' on' : '') + '" data-a="rec" data-k="' + key + '">' + (recNow ? '■ とめる' : '● 録音') + '</button>' +
          '<button data-a="play" data-k="' + key + '"' + (has ? '' : ' disabled') + '>▶ きく</button>' +
          '<button class="del" data-a="del" data-k="' + key + '"' + (has ? '' : ' disabled') + '>けす</button>' +
          '<span class="st">' + (has ? '✔ 録音あり' : 'なし') + '</span></div>';
      }

    if (msg) h += '<p class="msg">' + esc(msg) + '</p>';
    h += '</section>';
    h += '<section><h2>よみあげの声</h2>';
    if (!Voice.ok) h += '<p class="note">この ブラウザでは よみあげが つかえません。</p>';

    if (best < 30) h += '<p class="note strong">もっと自然な声にするには：iPhoneの「設定」→「アクセシビリティ」→「読み上げコンテンツ」→「声」→「日本語」で、<b>Kyoko（拡張）</b>や<b>O-Ren（拡張）</b>などをダウンロード → このアプリを開きなおして、上で えらんでください。</p>';
    h += '</section>';
    h += '<section><h2>ひらがな</h2>';
    for (const k of ['big', 'small']) {
      const v = HiraSave.get(k), nm = k === 'big' ? KIDS.big : KIDS.small;
      h += '<div class="grp"><div class="gt">' + esc(nm) + '</div><div class="hint">おぼえた字：' + Math.min(v.n, KANA.length) + ' / ' + KANA.length + '　クリアした日：' + v.days.length + '日' + (v.last === todayStr() ? '（きょう クリアずみ）' : '') + '</div>' +
        '<div class="rrow"><button data-a="again" data-k="' + k + '"' + (v.last === todayStr() ? '' : ' disabled') + '>きょうの分を もう1回</button>' +
        '<button class="del" data-a="reset" data-k="' + k + '">さいしょから</button></div></div>';
    }
    h += '</section><p class="note">書き順データ：KanjiVG（CC BY-SA 3.0, kanjivg.tagaini.net）</p></div>';
    el.innerHTML = h;
  }
  let recKey = '', msg = '';
  function onClick(e) {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const a = b.dataset.a, k = b.dataset.k;
    Sound.unlock();
    Sound.tick();
    if (a === 'close') { Sound.back(); close(); }
    else if (a === 'rec') {
      if (Rec.recording) { Rec.stop(); return; }
      recKey = k; msg = '録音中…（5秒で自動で とまります）';
      Voice.stop();
      Rec.start(k, (okk, err) => { recKey = ''; msg = okk ? '録音しました' : ('録音できませんでした：' + (err || '')); render(); if (okk) setTimeout(() => Rec.play(k), 150); });
      setTimeout(render, 30);
    }
    else if (a === 'play') Rec.play(k);
    else if (a === 'del') { if (confirm('この録音を けしますか？')) { Rec.del(k); msg = ''; render(); } }
    else if (a === 'voice') { const v = Voice.list[+b.dataset.i]; Voice.choose(v); Voice.test(v, KIDS.small + '、すごーい！ じょうずだね！'); render(); }
    else if (a === 'again') { HiraSave.undoToday(k); render(); }
    else if (a === 'reset') { if (confirm('ひらがなの記録を さいしょに もどしますか？')) { HiraSave.reset(k); render(); } }
    else if (a === 'photoReset') { try { localStorage.removeItem('tapasobo:photo'); } catch (e2) {} loadPraisePhoto(); setTimeout(render, 50); }
  }
  /* えらんだ写真を まんなかで正方形に切りぬいて 360px で保存 */
  function onPhoto(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
      c.width = c.height = 360;
      c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 360, 360);
      URL.revokeObjectURL(url);
      try { store.set('photo', c.toDataURL('image/jpeg', 0.85)); } catch (e2) {}
      loadPraisePhoto(); Sound.sparkle();
      setTimeout(render, 80);
    };
    img.onerror = () => { URL.revokeObjectURL(url); msg = '写真を よみこめませんでした'; render(); };
    img.src = url;
  }
  function open() {
    if (!el) {
      el = document.createElement('div');
      el.id = 'ov';
      el.addEventListener('click', onClick);
      el.addEventListener('change', e => { if (e.target && e.target.dataset.a === 'photo') onPhoto(e); });
      document.body.appendChild(el);
      Voice.onChange(() => { if (isOpen) render(); });
    }
    isOpen = true; msg = '';
    Voice.load();
    document.documentElement.classList.add('ovopen');
    el.style.display = 'block';
    el.scrollTop = 0;
    render();
  }
  function close() {
    if (Rec.recording) Rec.stop();
    isOpen = false;
    document.documentElement.classList.remove('ovopen');
    if (el) el.style.display = 'none';
  }
  return { open, close, get isOpen() { return isOpen; } };
})();

/* ================= ぜんたいの進行 ================= */
const scenes = { home: Home, drive: Drive, hira: Hira, balloon: Balloon, firework: Firework, peek: Peek, mole: Mole, music: Music, number: NumberGame };
let cur = Home, curId = 'home', trans = null, errCount = 0, resizePending = false, rectL = 0, rectT = 0;
const pointers = new Map();

/* もどるボタン：左上の小さな丸を 0.7 秒 長押し */
const backBtn = makeHold(0.7, () => { Sound.back(); go('home', backBtn.x, backBtn.y); });
const HOME_HOLDS = [soundBtn, voiceBtn, setBtn], GAME_HOLDS = [backBtn], ALL_HOLDS = [backBtn, soundBtn, voiceBtn, setBtn];
const holds = () => curId === 'home' ? HOME_HOLDS : GAME_HOLDS;
function placeUI() { backBtn.r = 17; backBtn.x = safe.l + 30; backBtn.y = safe.t + 30; }

function go(id, x, y) {
  if (trans || !scenes[id] || id === curId) return;
  trans = { ph: 0, t: 0, id, x: x === undefined ? W / 2 : x, y: y === undefined ? H / 2 : y, color: scenes[id].bgColor };
  Sound.whoosh();
}
function switchScene(id) {
  try { if (cur.exit) cur.exit(); } catch (e) {}
  parts.length = 0; banner = null;
  Voice.stop();
  curId = id; cur = scenes[id];
  cur.enter();
}
function drawTrans() {
  if (!trans) return;
  ctx.fillStyle = trans.color;
  if (trans.ph === 0) {
    const R = Math.hypot(Math.max(trans.x, W - trans.x), Math.max(trans.y, H - trans.y)) + 6;
    ctx.beginPath(); ctx.arc(trans.x, trans.y, R * inOut(clamp(trans.t / 0.3, 0, 1)), 0, TAU); ctx.fill();
  } else {
    const R = Math.hypot(W / 2, H / 2) + 6;
    ctx.beginPath(); ctx.rect(0, 0, W, H);
    ctx.arc(W / 2, H / 2, Math.max(0.01, R * inOut(clamp(trans.t / 0.36, 0, 1))), 0, TAU, true);
    ctx.fill('evenodd');
  }
}

function step(dt) {
  if (resizePending) doResize();
  for (const b of ALL_HOLDS) {
    b.hintT = Math.max(0, b.hintT - dt);
    if (b.id === null) continue;
    const ptr = pointers.get(b.id);
    if (!ptr || !holdHit(b, ptr.x, ptr.y, 10)) { b.id = null; b.p = 0; continue; }
    b.p += dt / b.dur;
    if (b.p >= 1) { b.id = null; b.p = 0; b.onDone(); }
  }
  if (trans) {
    trans.t += dt;
    if (trans.ph === 0 && trans.t >= 0.3) { switchScene(trans.id); trans.ph = 1; trans.t = 0; }
    else if (trans.ph === 1 && trans.t >= 0.36) trans = null;
  }
  cur.update(dt);
  updateParts(dt);
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
}
function render() {
  ctx = mainCtx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  cur.draw();
  drawParts();
  drawBanner();
  if (curId !== 'home') drawBack(backBtn);
  drawTrans();
}
/* もし途中でエラーが続いたら、止まらずホームにもどす */
function recover() {
  try { if (cur.exit) cur.exit(); } catch (e) {}
  parts.length = 0; banner = null; trans = null;
  curId = 'home'; cur = Home;
  try { Home.enter(); } catch (e) {}
}
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.hidden) { lastTs = ts; return; }
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!(dt > 0)) dt = 0.016;
  if (dt > 0.05) dt = 0.05;
  time += dt;
  try { step(dt); render(); errCount = 0; }
  catch (err) {
    if (window.console) console.error(err);
    if (++errCount > 20) { errCount = 0; recover(); }
  }
}

function doResize() {
  resizePending = false;
  if (!measure()) return;
  const r = canvas.getBoundingClientRect();
  rectL = r.left; rectT = r.top;
  placeUI();
  if (cur.resize) cur.resize();
}

/* ================= タッチ ================= */
function activation() { Sound.unlock(); Voice.unlock(); if (!recWarm) { recWarm = true; Rec.ready.then(() => Rec.warmup()); } }
let recWarm = false;
function safely(fn) { try { fn(); } catch (err) { if (window.console) console.error(err); } }

function ptDown(id, cx, cy) {
  const p = { id, x: cx - rectL, y: cy - rectT };
  pointers.set(id, p);
  if (trans && trans.ph === 0) return;
  for (const b of holds()) {
    if (holdHit(b, p.x, p.y, 0)) { b.id = id; b.p = 0; b.t0 = time; Sound.tick(); Sound.charge(b.dur); return; }
  }
  safely(() => { if (cur.down) cur.down(p); });
}
function ptMove(id, cx, cy) {
  const p = pointers.get(id);
  if (!p) return;
  p.x = cx - rectL; p.y = cy - rectT;
  if (trans && trans.ph === 0) return;
  for (const b of ALL_HOLDS) if (b.id === id) return;
  safely(() => { if (cur.move) cur.move(p); });
}
function ptUp(id) {
  const p = pointers.get(id);
  if (!p) return;
  pointers.delete(id);
  for (const b of ALL_HOLDS) {
    if (b.id === id) {
      if (time - b.t0 < 0.4) { b.hintT = 2; Sound.nope(); }   // ちょんと押しただけ → 「ながおし」と教える
      b.id = null; b.p = 0;
      return;
    }
  }
  safely(() => { if (cur.up) cur.up(p); });
}

/* iPhone/iPad はタッチイベントで受ける（何本指でも同時に反応）。
   ここで preventDefault するので、スクロール・ズーム・選択・長押しメニューは起きない */
const HAS_TOUCH = 'ontouchstart' in window;
function onTouch(e) {
  if (Settings.isOpen) return;   // おとなの画面はふつうに スクロール・タップできる
  if (e.cancelable) e.preventDefault();
  const type = e.type, ch = e.changedTouches;
  if (type === 'touchstart') Sound.unlock();
  for (let i = 0; i < ch.length; i++) {
    const t = ch[i], id = 't' + t.identifier;
    if (type === 'touchstart') ptDown(id, t.clientX, t.clientY);
    else if (type === 'touchmove') ptMove(id, t.clientX, t.clientY);
    else ptUp(id);
  }
  if (type !== 'touchmove') {
    /* はなれたのに通知がこなかった指があれば片づける */
    const live = new Set();
    for (let i = 0; i < e.touches.length; i++) live.add('t' + e.touches[i].identifier);
    pointers.forEach((p, id) => { if (id.charAt(0) === 't' && !live.has(id)) ptUp(id); });
    if (type !== 'touchstart') activation();
  }
}
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(t => document.addEventListener(t, onTouch, { passive: false }));

/* マウスなど（パソコンで動かすとき用） */
function onPointer(e) {
  if (HAS_TOUCH && e.pointerType !== 'mouse') return;   // タッチは上で処理ずみ
  const id = 'p' + e.pointerId;
  if (e.type === 'pointerdown') {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    Sound.unlock();
    ptDown(id, e.clientX, e.clientY);
  } else if (e.type === 'pointermove') ptMove(id, e.clientX, e.clientY);
  else { ptUp(id); activation(); }
}
if (window.PointerEvent) {
  ['pointerdown', 'pointermove', 'pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, onPointer, { passive: false }));
} else {
  canvas.addEventListener('mousedown', e => { if (e.button === 0) { e.preventDefault(); Sound.unlock(); ptDown('m', e.clientX, e.clientY); } });
  window.addEventListener('mousemove', e => ptMove('m', e.clientX, e.clientY));
  window.addEventListener('mouseup', () => { ptUp('m'); activation(); });
}
['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick', 'selectstart', 'dragstart'].forEach(t => {
  document.addEventListener(t, e => { if (!(Settings.isOpen && t === 'selectstart')) e.preventDefault(); }, { passive: false });
});
document.addEventListener('click', activation);
window.addEventListener('keydown', e => { activation(); if (e.key === 'Escape') go('home'); });

function dropPointers() {
  pointers.clear();
  for (const b of ALL_HOLDS) { b.id = null; b.p = 0; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { dropPointers(); Voice.stop(); Sound.suspend(); }
  else { Sound.wake(); resizePending = true; }
});
window.addEventListener('blur', dropPointers);
window.addEventListener('pagehide', () => { Voice.stop(); });

const askResize = () => { resizePending = true; };
window.addEventListener('resize', askResize);
window.addEventListener('orientationchange', () => { askResize(); setTimeout(askResize, 350); setTimeout(askResize, 800); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', askResize);
if (window.ResizeObserver) new ResizeObserver(askResize).observe(canvas);
setInterval(askResize, 1500);   // iPhone で画面サイズの通知が遅れることがあるため念のため

/* ホーム画面に追加したときのアイコンを、ブラウザのタブにも使う */
try {
  const ic = document.querySelector('link[rel="apple-touch-icon"]');
  if (ic && ic.href.indexOf('data:') === 0) { const l = document.createElement('link'); l.rel = 'icon'; l.href = ic.href; document.head.appendChild(l); }
} catch (e) {}

measure();
doResize();
placeUI();
{ const r = canvas.getBoundingClientRect(); rectL = r.left; rectT = r.top; }
Home.enter();
requestAnimationFrame(frame);

})();

</script>
